{id:"w2d3",title:"because of — 짧게 이유 말하기",pat:"because of + 명사구 (문장 아님)",models:[["Flights were cancelled because of the bad weather.","악천후 때문에 항공편이 취소됐습니다."],["Many people move to cities because of better job opportunities.","많은 사람이 더 좋은 일자리 때문에 도시로 이사합니다."],["The match was postponed because of heavy rain.","폭우 때문에 경기가 연기됐습니다."]],note:"because 뒤는 문장, because of 뒤는 명사 덩어리. 이 구분 하나만 정확해도 문장이 훨씬 다양해 보입니다.",ex:[["mcq","builder","b7"],["mcq","chunk","k19"],["mcq","chunk","k2"]]},
{id:"w2d4",title:"목적과 수단 — to / By ~ing",pat:"행동 + to + 목적 · By ~ing, + 결과",models:[["The government should invest in renewable energy to reduce pollution.","정부는 오염을 줄이기 위해 재생 에너지에 투자해야 합니다."],["By using public transport, we can reduce air pollution.","대중교통을 이용함으로써 대기 오염을 줄일 수 있습니다."],["Students use language apps to improve their English.","학생들은 영어를 늘리기 위해 언어 앱을 사용합니다."]],note:"해결책을 쓰는 문장(문제해결형·의견형 본문)의 핵심 패턴 두 가지예요. '무엇을 해야 한다' 다음에 to로 목적, By ~ing으로 수단을 붙이세요.",ex:[["order","builder","b15"],["mcq","clinic","c11"],["mcq","chunk","k14"]]},
{id:"w2d5",title:"1~2주차 총복습 — 이유·결과 세트",pat:"because / so / because of / to 구분하기",models:[["Because the weather was bad, the flights were cancelled.","날씨가 나빠서 항공편이 취소됐습니다."],["The government built a new subway to reduce traffic congestion.","정부는 교통 혼잡을 줄이기 위해 새 지하철을 지었습니다."]],note:"오늘은 섞어서 나옵니다. 연결어를 보고 방향(이유인지 결과인지 목적지)을 먼저 판단하는 게 요령이에요.",ex:[["mcq","builder","b1"],["mcq","builder","b7"],["mcq","builder","b6"],["order","builder","b11"]]}
]},
{w:3,title:"복문으로 깊이 더하기",desc:"because를 넘어서 — 양보·조건·관계절까지 안정적으로 쓰는 주입니다.",lessons:[
{id:"w3d1",title:"although — 단점을 먼저 인정하기",pat:"Although + 단점, + 그럼에도 주장",models:[["Although electric cars are expensive, they produce less pollution.","전기차는 비싸지만, 오염을 덜 일으킵니다."],["Although studying abroad can be lonely, it helps students become independent.","유학은 외로울 수 있지만, 학생들이 자립하는 데 도움이 됩니다."],["Although online learning is convenient, some students prefer face-to-face classes.","온라인 학습은 편리하지만, 일부 학생은 대면 수업을 선호합니다."]],note:"세 문장의 공통 모양을 보세요. 앞덩어리에서 단점이나 불리한 점을 먼저 인정하고, 콤마 뒤에서 '그래도 이게 사실이다'라고 말합니다. 상대쪽의 일부를 인정하면 내 주장이 더 믿을 만해 보여요. 주의할 점은 딱 하나 — Although 덩어리만 따로 마침표로 끊으면 조각 문장이 됩니다.",ex:[["mcq","builder","b2"],["mcq","builder","b9"],["order","builder","b27"],["order","builder","b10"]]},
{id:"w3d2",title:"if — 조건으로 근거 만들기",pat:"If + 현재형, + will + 결과",models:[["If governments invest in public transport, traffic will decrease.","정부가 대중교통에 투자하면 교통량이 줄어들 것입니다."],["If students read regularly, they will write better essays.","학생들이 꾸준히 읽으면 더 나은 에세이를 쓰게 될 것입니다."],["If people use less plastic, oceans will become cleaner.","사람들이 플라스틱을 덜 쓰면 바다가 더 깨끗해질 것입니다."]],note:"앞덩어리는 조건, 뒷덩어리는 그 조건에서 나오는 결과예요. 규칙은 딱 하나만 몸에 붙이면 됩니다. If 덩어리 안에서는 will을 쓰지 않고 현재형으로 쓰고, will은 결과 쪽에만 둡니다. 문제해결형과 의견형 본문의 근거는 대부분 이 '조건 → 결과' 모양으로 만들어집니다.",ex:[["mcq","builder","b4"],["mcq","builder","b19"],["order","builder","b11"],["order","builder","b23"]]},
{id:"w3d3",title:"when — 상황 + 결과",pat:"When + 상황, + 결과",models:[["When people exercise regularly, they sleep better at night.","사람들은 규칙적으로 운동하면 밤에 더 잘 잡니다."],["When students receive clear feedback, they know how to improve.","학생들은 명확한 피드백을 받으면 어떻게 개선해야 할지 알게 됩니다."],["When traffic increases, air quality becomes worse.","교통량이 늘면 공기 질이 나빠집니다."]],note:"모양은 어제 배운 If와 똑같습니다. 콤마 앞은 상황, 뒤는 그 상황에서 일어나는 결과예요. 느낌의 차이만 알아두세요. if가 '만약 그런 조건이라면'에 가깝다면, when은 '그런 상황이 오면 늘 그렇다'는 일반적 사실에 가깝습니다. 둘 다 콤마 뒤에 완전한 결과가 와야 합니다.",ex:[["mcq","builder","b5"],["mcq","builder","b20"],["order","builder","b14"],["order","builder","b24"]]},
{id:"w3d4",title:"which / who — 설명 붙이기",pat:"사람 + who · 사물 + which + 설명",models:[["People who exercise regularly tend to live longer.","규칙적으로 운동하는 사람들은 더 오래 사는 경향이 있습니다."],["The city introduced a new bus system, which reduced traffic in the centre.","그 도시는 새 버스 시스템을 도입했고, 그 결과 도심의 교통량이 줄었습니다."],["Students who read widely usually write better essays.","폭넓게 읽는 학생들은 보통 더 나은 에세이를 씁니다."]],note:"앞 명사에 설명을 한 덩어리 더 붙이는 모양이에요. 사람을 설명하면 who, 사물이나 앞 문장 전체를 받으면 which를 씁니다. 가장 흔한 실수는 설명 덩어리 뒤에 they나 it을 또 쓰는 것 — who와 which가 이미 주어 역할을 하고 있어서 필요 없습니다. 두 번째 문장처럼 앞 문장 전체를 받을 때는 콤마 + which입니다.",ex:[["mcq","builder","b3"],["mcq","builder","b8"],["order","builder","b25"],["order","builder","b12"]]},
{id:"w3d5",title:"3주차 총복습 — 복문 세트",pat:"although / if / when / who·which 구분하기",models:[["Although public transport is cheap, many people still prefer to drive.","대중교통은 저렴하지만, 많은 사람은 여전히 직접 운전하는 것을 선호합니다."],["If cities build safer cycle lanes, more people will cycle to work.","도시가 더 안전한 자전거 도로를 만들면, 더 많은 사람이 자전거로 출근할 것입니다."]],note:"오늘은 섞어서 나옵니다. 문제를 풀기 전에 연결어부터 보고 관계를 판단하세요. although는 '인정하고 뒤집기', if는 '조건 → 결과', when은 '상황 → 결과', who와 which는 '명사에 설명 붙이기'입니다. 헷갈리면 답을 고르기 전에 이 네 가지 중 무엇인지 먼저 말해보는 게 요령이에요.",ex:[["mcq","builder","b9"],["mcq","builder","b19"],["mcq","builder","b20"],["mcq","builder","b21"],["order","builder","b26"]]}
]},
{w:4,title:"문단 — 뼈대 세우기",desc:"문장이 모여 문단이 되는 규칙. 주제문 하나로 문단 전체가 예고됩니다.",lessons:[
{id:"w4d1",title:"주제문 — 문단의 예고편",pat:"주제문 = 주제 + 핵심 주장 (문단 전체를 예고)",models:[["Regular exercise provides several important benefits for both the body and the mind.","규칙적인 운동은 몸과 마음 모두에 몇 가지 중요한 이점을 제공합니다."],["Online learning offers several benefits for students, especially those who have part-time jobs.","온라인 학습은 학생들, 특히 아르바이트를 하는 학생들에게 여러 이점을 제공합니다."],["Public transport plays a key role in protecting the environment in large cities.","대중교통은 대도시의 환경을 보호하는 데 핵심적인 역할을 합니다."]],note:"세 문장을 보세요. 전부 '무엇에 대한 문단인지(주제)'와 '그 주제에 대해 무엇을 증명할 것인지(핵심 주장)'를 한 번에 말합니다. 그래서 이 문장만 읽으면 뒤에 나올 내용이 머릿속에 그려져요. 반대로 'Exercise is good.'은 너무 막연해서 무엇을 쓸지 예고가 안 되고, '저는 매일 아침 공원에서 운동합니다' 같은 개인 이야기는 너무 좁아서 문단 전체를 대표하지 못합니다. 문단의 첫 문장에 붙는 이름표가 바로 주제문(topic sentence)입니다.",ex:[["para","para","p3"],["para","para","p1"],["mcq","chunk","k1"],["para","para","p4"]]},
{id:"w4d2",title:"근거에 설명 붙이기",pat:"근거 + This means / In other words + 풀어쓴 설명",models:[["Buses and trains carry many passengers at once. This means fewer cars on the road and less air pollution.","버스와 기차는 한 번에 많은 승객을 나릅니다. 이는 도로 위의 차가 줄고 대기 오염이 감소한다는 뜻입니다."],["Graduates tend to earn higher salaries. This means they can pay more tax and support public services.","대학 졸업자들은 더 높은 급여를 받는 경향이 있습니다. 이는 그들이 세금을 더 내고 공공 서비스를 뒷받침할 수 있다는 뜻입니다."],["Online courses are usually cheaper than traditional classes. In other words, students can save money while they study.","온라인 강의는 보통 전통적인 수업보다 저렴합니다. 다시 말해, 학생들은 공부하면서 돈을 아낄 수 있습니다."]],note:"모델을 보면 근거 문장 뒤에 항상 한 문장이 더 따라옵니다. 근거만 던지면 읽는 사람이 '그래서 그게 왜 좋은데?'를 스스로 추측해야 해요. This means나 In other words로 시작하는 문장은 그 추측을 대신 해 주는 문장입니다 — 근거를 쉬운 말로 풀고, 결과가 무엇인지까지 보여 줍니다. 본문 문장이 짧아서 고민이라면 새 근거를 억지로 찾기 전에, 있는 근거에 설명 한 문장을 붙여 보세요. 이 설명 문장의 이름은 supporting sentence 중에서도 '설명 문장'이에요.",ex:[["para","para","p4"],["order","builder","b12"],["order","builder","b26"],["mcq","builder","b3"]]},
{id:"w4d3",title:"예시 들기 — For example",pat:"주장 + For example, + 구체적인 한 장면 (주어 + 동사)",models:[["Technology has changed how people communicate. For example, smartphones allow families in different countries to see each other on video calls every day.","기술은 사람들이 소통하는 방식을 바꿨습니다. 예를 들어, 스마트폰 덕분에 다른 나라에 사는 가족들이 매일 영상 통화로 서로를 볼 수 있습니다."],["Some cities have reduced traffic successfully. For example, London introduced a congestion charge, and traffic in the city centre fell.","일부 도시는 교통량을 성공적으로 줄였습니다. 예를 들어, 런던은 혼잡 통행료를 도입했고, 도심의 교통량이 줄었습니다."],["Exercise can improve mental health. For example, people who walk for 30 minutes a day often report less stress.","운동은 정신 건강을 개선할 수 있습니다. 예를 들어, 하루 30분 걷는 사람들은 스트레스가 줄었다고 말하는 경우가 많습니다."]],note:"예시 문장의 공통점을 보세요. 전부 숫자(30분), 장소(런던), 구체적인 장면(영상 통화) 중 하나가 들어 있어 머릿속에 그림이 그려집니다. 막연한 주장은 예시 하나로 믿을 만해져요. 주의할 점은 어제와 같은 조각 문장 오류입니다 — For example 뒤에도 주어와 동사가 있는 완전한 문장이 와야 합니다. 참고로 For instance도 똑같은 역할을 하는 안전한 교체 표현이에요.",ex:[["mcq","clinic","c16"],["para","para","p1"],["para","para","p6"],["para","para","p4"]]},
{id:"w4d4",title:"연결어 — 문장과 문장 사이",pat:"First / In addition / However / As a result — 관계에 맞는 신호",models:[["Online courses are flexible. In addition, they are usually cheaper than traditional classes.","온라인 강의는 유연합니다. 게다가, 보통 전통적인 수업보다 저렴합니다."],["Smartphones make communication instant. However, this constant connection can also cause stress.","스마트폰은 소통을 즉각적으로 만듭니다. 하지만, 이렇게 끊임없이 연결된 상태는 스트레스를 유발할 수도 있습니다."],["Online learning is now widely available. As a result, more people can access education.","온라인 학습은 이제 널리 이용 가능합니다. 그 결과, 더 많은 사람이 교육에 접근할 수 있게 됐습니다."]],note:"연결어는 문장과 문장 사이의 신호등이에요. In addition은 '하나 더 얹는다', However는 '반대쪽으로 꺾는다', As a result는 '그래서 이렇게 된다', First는 '첫 번째 이유다'라는 신호입니다. 문법이 다 맞아도 신호가 틀리면 읽는 사람은 길을 잃어요 — However를 써 놓고 같은 방향 이야기를 하면 안 되는 이유입니다. 반대 관점을 여는 On the other hand도 However와 같은 팀이에요. 오늘 조립하는 두 문단에서 이 신호들이 순서를 알려 주는 역할을 합니다.",ex:[["para","para","p2"],["para","para","p5"],["mcq","builder","b6"],["mcq","clinic","c9"]]},
{id:"w4d5",title:"문단 조립 실습",pat:"주제문 → 근거 → 예시·설명 → 연결 → 마무리",models:[["Public transport plays a key role in protecting the environment. Buses and trains carry many passengers at once. This means fewer cars on the road and less air pollution. For instance, one full bus can replace dozens of private cars. Therefore, governments should invest more in public transport.","대중교통은 환경을 보호하는 데 핵심적인 역할을 합니다. 버스와 기차는 한 번에 많은 승객을 나릅니다. 이는 도로 위의 차가 줄고 대기 오염이 감소한다는 뜻입니다. 예를 들어, 만원 버스 한 대가 자가용 수십 대를 대신할 수 있습니다. 따라서 정부는 대중교통에 더 많이 투자해야 합니다."],["Working from home has become increasingly popular. Employees save time because they do not need to commute. They can also spend more time with their families. On the other hand, some workers feel isolated at home. Despite this drawback, remote work is likely to remain common.","재택근무는 점점 더 인기를 얻고 있습니다. 직원들은 출퇴근할 필요가 없어 시간을 절약합니다. 가족과 더 많은 시간을 보낼 수도 있습니다. 반면에, 일부 직원들은 집에서 고립감을 느낍니다. 이런 단점에도 불구하고, 재택근무는 계속 흔하게 유지될 가능성이 높습니다."]],note:"이번 주에 배운 뼈대를 완성된 문단 두 개로 먼저 확인하세요. 첫 문장은 주제문, 중간에는 근거와 설명·예시가 이어지고, 마지막 문장은 주제문을 살짝 바꿔 문단을 닫습니다. 오늘 조립 실습에서는 순서를 고르기 전에 각 문장의 역할부터 말해 보는 게 요령이에요 — '이건 주제문, 이건 예시, 이건 반대 신호(However/On the other hand) 뒤에 올 문장'처럼요. 역할을 알면 순서는 대부분 자동으로 정해집니다.",ex:[["para","para","p2"],["para","para","p4"],["para","para","p5"],["para","para","p6"]]}]},
{w:5,title:"서론 — 패러프레이즈와 입장",desc:"질문을 내 말로 바꾸고, 입장을 한 문장으로 못 박는 주입니다.",lessons:[
{id:"w5d1",title:"패러프레이즈 1 — 단어 교체",pat:"질문 문장 → 핵심어 3개 교체 + 주체 흐리기",models:[["Some people think that university education should be free for all students. → It is believed that everyone should be able to attend university without paying fees.","원문: 대학 교육은 모든 학생에게 무료여야 한다고 일부 사람들은 생각한다 → 바꿈: 모든 사람이 수업료를 내지 않고 대학에 다닐 수 있어야 한다고 여겨진다"],["Many people believe that social networking sites have had a negative effect on individuals and society. → Social media platforms are thought to have harmed both people and communities.","원문: 소셜 네트워크 사이트가 개인과 사회에 부정적인 영향을 미쳤다고 많은 사람이 믿는다 → 바꿈: 소셜 미디어 플랫폼이 사람들과 공동체 모두에게 해를 끼친 것으로 여겨진다"],["Many children nowadays spend too much time playing video games. → These days, a large number of children spend excessive amounts of time on video games.","원문: 요즘 많은 아이가 비디오 게임에 너무 많은 시간을 쓴다 → 바꿈: 요즘에는 많은 수의 아이가 비디오 게임에 과도한 양의 시간을 쓴다"]],note:"바꾼 문장을 원문과 나란히 보세요. 뜻은 그대로인데 눈에 띄는 단어가 거의 다 바뀌어 있습니다. free는 without paying fees로, many는 a large number of로, nowadays는 these days로요. 바뀐 곳이 세 곳 정도가 딱 좋습니다 — 한 곳만 바꾸면 베낀 느낌이 남고, 뜻까지 바꾸면 감점이에요. 그리고 Some people think를 It is believed that처럼 바꾸면 누가 말하는지(주체)가 흐려지면서 문장이 한결 격식 있어 보입니다. 이렇게 질문 문장을 뜻은 같게, 단어는 다르게 다시 쓰는 기술을 패러프레이즈(paraphrase)라고 합니다.",ex:[["mcq","paraphrase","pp1"],["mcq","paraphrase","pp2"],["mcq","paraphrase","pp7"],["mcq","paraphrase","pp5"]]},
{id:"w5d2",title:"패러프레이즈 2 — 구조 교체",pat:"동사구 → 명사구 · 순서 교체 · 수동태 유지",models:[["Some people say that the best way to reduce crime is to give longer prison sentences. → It is argued that increasing the length of prison terms is the most effective way to lower crime rates.","원문: 범죄를 줄이는 가장 좋은 방법은 더 긴 징역형을 주는 것이라고 일부 사람들은 말한다 → 바꿈: 징역 기간을 늘리는 것이 범죄율을 낮추는 가장 효과적인 방법이라고 주장된다"],["As technology develops, traditional skills such as making food by hand are disappearing. → Traditional abilities like cooking by hand are being lost as technology advances.","원문: 기술이 발전하면서 손으로 음식을 만드는 것 같은 전통 기술이 사라지고 있다 → 바꿈: 손으로 요리하는 것 같은 전통 능력은 기술이 발전하면서 사라지고 있다"],["Some people believe that school children should not be given homework. → It is believed that homework should not be assigned to school pupils.","원문: 학교 아이들에게 숙제를 내줘서는 안 된다고 일부 사람들은 믿는다 → 바꿈: 숙제는 학생들에게 부과되어서는 안 된다고 여겨진다"]],note:"이번엔 단어만 바꾼 게 아닙니다. 첫 문장은 give longer prison sentences라는 동사 덩어리를 increasing the length of prison terms라는 명사 덩어리로 바꿨고, 두 번째는 문장의 앞뒤 순서를 통째로 바꿨으며, 세 번째는 수동태 모양은 그대로 둔 채 동사만 given에서 assigned로 갈았습니다. 모양까지 바꾸면 같은 뜻을 말해도 베낀 느낌이 사라져요. 단, 어떤 모양으로 바꾸든 뜻이 뒤집히면 안 됩니다 — rather than의 앞뒤가 바뀌는 실수가 대표적이에요. 단어 교체보다 한 단계 위인 이 기술의 이름은 구조 교체입니다.",ex:[["mcq","paraphrase","pp3"],["mcq","paraphrase","pp14"],["mcq","paraphrase","pp10"],["mcq","paraphrase","pp6"]]},
{id:"w5d3",title:"입장문 — 의견형",pat:"입장 (I completely agree / I firmly believe) + because + 이유 예고",models:[["I completely agree with this view because equal access to education benefits both individuals and society as a whole.","저는 이 견해에 완전히 동의합니다. 교육에 대한 평등한 접근은 개인과 사회 전체 모두에게 이익이 되기 때문입니다."],["I firmly believe that governments should invest more in public transport because it reduces both traffic and air pollution.","저는 정부가 대중교통에 더 많이 투자해야 한다고 굳게 믿습니다. 교통량과 대기 오염을 모두 줄여 주기 때문입니다."],["In my view, remote work is more beneficial than office-based work because it saves time and improves work-life balance.","제 생각에 재택근무가 사무실 근무보다 더 유익합니다. 시간을 절약하고 일과 삶의 균형을 개선해 주기 때문입니다."]],note:"세 문장의 시작을 보세요. 전부 내 입장이 첫머리에서 분명하게 드러납니다 — completely agree, firmly believe, In my view처럼요. 그리고 because 뒤에 이유가 짧게 따라붙어 본문에서 무슨 이야기를 할지까지 예고합니다. 반대로 입장 없이 '이 에세이에서는 ~를 논의하겠다'만 쓰거나, 이유 예고 없이 '동의합니다' 한마디로 끝내면 서론이 약해져요. 본문은 이 한 문장이 약속한 대로만 쓰면 됩니다. 에세이 전체의 입장을 한 문장으로 못 박는 이 문장을 입장문(thesis statement)이라고 합니다.",ex:[["mcq","paraphrase","pp15"],["mcq","builder","b33"],["order","builder","b28"],["order","builder","b32"]]},
{id:"w5d4",title:"입장문 — 논의형·이중질문형",pat:"논의형: While 양쪽 + 내 의견 · 이중질문형: 질문 2개 예고",models:[["While competition teaches children to work hard, cooperation is equally important, and in my view schools should develop both skills.","경쟁은 아이들에게 열심히 노력하는 법을 가르치지만, 협력도 똑같이 중요하며, 제 생각에 학교는 두 능력을 모두 길러야 합니다."],["While both skills are important, I believe that cooperation deserves greater emphasis in schools.","두 능력 모두 중요하지만, 저는 협력이 학교에서 더 강조되어야 한다고 생각합니다."],["This essay will examine the main causes of this problem and suggest several possible solutions.","이 에세이는 이 문제의 주요 원인을 살펴보고 몇 가지 가능한 해결책을 제시할 것입니다."]],note:"앞의 두 문장을 보세요. 논의형 입장문에는 세 가지가 한꺼번에 들어갑니다 — While로 여는 한쪽 관점, 반대쪽 관점, 그리고 '그래서 내 의견은 이것'까지요. 하나라도 빠지면 질문에 다 답하지 않은 셈이 됩니다. 세 번째 문장은 다릅니다. 이중질문형과 문제해결형에서는 내 의견을 앞세우는 대신, 질문 두 개를 그대로 예고하는 문장(This essay will examine ~ and suggest ~)이 입장문의 역할을 해요. 질문이 시키는 구조를 입장문에 먼저 박아 두는 것이 이 유형들의 핵심입니다.",ex:[["mcq","builder","b34"],["mcq","builder","b35"],["order","builder","b29"],["order","builder","b30"]]},
{id:"w5d5",title:"서론 조립 실습",pat:"서론 = 패러프레이즈 1문장 + 입장문 1문장",models:[["It is often argued that university education should be provided free of charge for all students. I completely agree with this view because equal access to education benefits both individuals and society as a whole.","대학 교육은 모든 학생에게 무료로 제공되어야 한다고 자주 주장됩니다. 저는 이 견해에 완전히 동의합니다. 교육에 대한 평등한 접근은 개인과 사회 전체 모두에게 이익이 되기 때문입니다."],["It is often debated whether children should be taught to compete or to cooperate with each other. While both skills are important, I believe that cooperation deserves greater emphasis in schools.","아이들에게 경쟁을 가르쳐야 할지 협력을 가르쳐야 할지는 자주 논의됩니다. 두 능력 모두 중요하지만, 저는 협력이 학교에서 더 강조되어야 한다고 생각합니다."]],note:"완성된 서론 두 개를 먼저 보세요. 둘 다 딱 두 문장입니다. 첫 문장은 질문을 내 말로 바꾼 패러프레이즈, 두 번째 문장은 입장을 못 박는 입장문. 예시나 세부 이유는 서론에 넣지 않습니다 — 그건 본문의 일이에요. 질문 문장을 그대로 베끼면 첫 문장부터 점수를 잃으니, 이번 주에 익힌 단어 교체와 구조 교체를 그대로 적용하세요. 오늘은 문제를 풀면서 이 두 문장짜리 서론을 직접 조립해 봅니다.",ex:[["mcq","builder","b36"],["order","builder","b31"],["mcq","paraphrase","pp9"],["order","builder","b29"]]}]},
{w:6,title:"본문 심화 — 설명·예시·토픽 청크",desc:"주제별로 바로 써먹는 표현 덩어리와 본문을 길게 밀어주는 확장 기술입니다.",lessons:[
{id:"w6d1",ready:true,title:"토픽 청크 1 — 교육·기술",pat:"학교/교육 주제 표현 덩어리 바로 쓰기",models:[["Schools play a key role in children's development.", "학교는 아이들의 발달에 핵심적인 역할을 합니다."],["All children should have access to quality education.", "모든 아이는 양질의 교육에 접근할 수 있어야 합니다."],["Technology has become increasingly popular in classrooms.", "기술은 교실에서 점점 인기가 많아졌습니다."]],note:"예문을 먼저 보고 모양을 느끼세요. play a key role in, have access to, become increasingly popular는 주제문이나 근거에 바로 꽂히는 덩어리예요. 문장을 통째로 암기하기보다 education, technology 같은 주제를 바꿔 끼우는 연습을 합니다. 격식체이면서도 IELTS에 자주 쓰이는 표현이라 유일 정답이 명확합니다.",ex:[["mcq","chunk","k1"],["mcq","chunk","k2"],["mcq","chunk","k6"]]}, {id:"w6d2",ready:true,title:"토픽 청크 2 — 건강·환경",pat:"건강·환경 문장 조각 붙이기",models:[["It is important to lead a healthy lifestyle.", "건강한 생활 방식을 유지하는 것이 중요합니다."],["Traffic is the main source of air pollution in large cities.", "교통은 대도시 대기 오염의 주요 원인입니다."],["Governments should invest in renewable energy sources.", "정부는 재생 에너지원에 투자해야 합니다."]],note:"건강과 환경 문제는 본문 근거로 자주 나옵니다. lead a healthy lifestyle, air pollution, renewable energy는 채점관이 선호하는 격식 표현 덩어리예요. 예문을 읽고 필요한 자리만 바꿔 쓰도록 연습합니다 — 예: Traffic is the main source of ... pollution. 형태로.",ex:[["mcq","chunk","k9"],["mcq","chunk","k16"],["mcq","chunk","k14"]]}, {id:"w6d3",ready:true,title:"토픽 청크 3 — 일·사회·가족·범죄",pat:"사회 주제 청크 연결",models:[["Flexible hours help employees achieve a better work-life balance.", "유연한 근무 시간은 직원들이 더 나은 일과 삶의 균형을 달성하는 데 도움이 됩니다."],["Taxes are used to fund public services such as hospitals and schools.", "세금은 병원과 학교 같은 공공 서비스를 지원하는 데 사용됩니다."],["Parents should spend more time with their children.", "부모는 아이들과 더 많은 시간을 보내야 합니다."]],note:"일·가정·사회 주제는 Task 2에 빈번합니다. work-life balance, public services, spend time with는 예문에서 모양을 확인한 뒤 바로 쓸 수 있는 표현입니다. 문법 용어는 필요 없습니다 — 모양이 맞아 들어가면 답은 하나입니다.",ex:[["mcq","chunk","k18"],["mcq","chunk","k21"],["mcq","chunk","k26"]]}, {id:"w6d4",ready:true,title:"예시 구체화하기",pat:"For example, + 구체 한 장면",models:[["Exercise improves mental health. For example, people who walk for 30 minutes a day often report less stress.", "운동은 정신 건강을 개선합니다. 예를 들어, 하루 30분 걷는 사람들은 스트레스가 줄었다고 말합니다."],["Online learning is flexible. For example, students with part-time jobs can study after work.", "온라인 학습은 유연합니다. 예를 들어, 아르바이트를 하는 학생들은 퇴근 후 공부할 수 있습니다."],["Regular exercise can prevent illness. For example, older adults who swim twice a week tend to have stronger hearts and visit doctors less often.", "규칙적인 운동은 질병을 예방할 수 있습니다. 예를 들어, 일주일에 두 번 수영하는 고령자는 심장이 더 튼튼한 편이고 병원에 가는 일이 적습니다."]],note:"예시는 막연한 근거를 살려주는 한 장면입니다. For example 뒤는 반드시 주어+동사가 있는 완전한 문장. 숫자는 없어도 구체적인 장면(30분 걷기, 퇴근 후 공부)이 들어가면 문장이 믿을 만해집니다.",ex:[["para","para","p1"],["para","para","p5"],["mcq","clinic","c16"]]}, {id:"w6d5",ready:true,title:"설명 확장 — This means / As a result",pat:"근거 → This means / In other words / As a result",models:[["Buses and trains carry many passengers at once. This means fewer cars on the road and less air pollution.", "버스와 기차는 한 번에 많은 승객을 나릅니다. 이는 도로 위의 차가 줄고 대기 오염이 감소한다는 뜻입니다."],["Technology is now cheap. As a result, more schools can buy devices.", "기술은 이제 저렴합니다. 그 결과, 더 많은 학교가 기기를 살 수 있습니다."],["Public libraries are free for everyone. This means that even students with little money can access books and computers.", "공공 도서관은 누구나 무료로 이용할 수 있습니다. 이는 돈이 적은 학생도 책과 컴퓨터를 이용할 수 있다는 뜻입니다."]],note:"근거 뒤에 설명 한 문장을 붙이면 길이가 자연스럽게 늘어납니다. This means는 '풀어쓰기', As a result는 '결과 연결' 신호예요. 복문이 필요 없어도 문단 전체가 풍성해집니다.",ex:[["para","para","p2"],["para","para","p4"],["order","builder","b17"]]}]},
{w:7,title:"유형별 구조",desc:"에세이 유형 5종의 뼈대를 각각 몸에 붙이는 주입니다.",lessons:[
{id:"w7d1",title:"의견형 (Agree or Disagree)",pat:"서론(입장) → 이유 1 문단 → 이유 2 문단 → 결론(입장 반복)",models:[["It is often argued that university education should be provided free of charge for all students. I completely agree with this view because equal access to education benefits both individuals and society as a whole.","대학 교육은 모든 학생에게 무료로 제공되어야 한다고 자주 주장됩니다. 저는 이 견해에 완전히 동의합니다. 교육에 대한 평등한 접근은 개인과 사회 전체 모두에게 이익이 되기 때문입니다."],["The main reason for my view is that free university education gives everyone a fair chance to succeed. Another reason is that society as a whole gains from having more educated citizens.","제 견해의 주된 이유는 무료 대학 교육이 모든 사람에게 성공할 공정한 기회를 주기 때문입니다. 또 다른 이유는 사회 전체가 더 교육받은 시민들로부터 이익을 얻기 때문입니다."],["In conclusion, I firmly believe that university education should be free for all students. It creates fairer opportunities for individuals and brings lasting benefits to society.","결론적으로, 저는 대학 교육이 모든 학생에게 무료여야 한다고 굳게 믿습니다. 이는 개인에게 더 공정한 기회를 만들고 사회에 지속적인 이익을 가져다줍니다."]],note:"완성된 에세이 한 편에서 뼈대 문장만 뽑아 놓은 것입니다. 서론에서 밝힌 입장을 본문 두 문단이 같은 방향으로만 뒷받침하고, 결론이 그 입장을 다시 말합니다. 중간에 반대쪽 문단을 끼우면 논의형과 섞여서 입장이 흐려져요. 이 문장들은 '에세이 조립' 탭의 의견형 에세이에 그대로 들어 있는 문장들이니, 레슨을 끝낸 뒤 조립으로 전체를 맞춰 보세요. 질문이 시키는 대로 한 방향을 끝까지 미는 이 구조의 이름이 의견형(Agree or Disagree)입니다.",ex:[["mcq","builder","b37"],["mcq","builder","b33"],["order","builder","b45"],["order","builder","b28"]]},
{id:"w7d2",title:"논의형 (Discuss Both Views)",pat:"서론(양쪽 + 내 의견) → 본문 1: 한쪽 관점 → 본문 2: 다른쪽 관점 + 내 의견 → 결론",models:[["It is often debated whether children should be taught to compete or to cooperate with each other. While both skills are important, I believe that cooperation deserves greater emphasis in schools.","아이들에게 경쟁을 가르쳐야 할지 협력을 가르쳐야 할지는 자주 논의됩니다. 두 능력 모두 중요하지만, 저는 협력이 학교에서 더 강조되어야 한다고 생각합니다."],["On the one hand, competition can motivate children to work hard and achieve their best. On the other hand, cooperation teaches children to communicate and solve problems as a team.","한편으로 경쟁은 아이들이 열심히 노력하고 최선을 다하도록 동기를 부여할 수 있습니다. 반면에 협력은 아이들에게 소통하고 팀으로 문제를 해결하는 법을 가르칩니다."],["In conclusion, although competition has some value in education, cooperation is more important for children's long-term development. Schools should therefore focus mainly on teaching children how to work well with others.","결론적으로, 경쟁도 교육에서 어느 정도 가치가 있지만, 협력이 아이들의 장기적인 발달에 더 중요합니다. 따라서 학교는 아이들이 다른 사람과 잘 협력하는 법을 가르치는 데 주로 집중해야 합니다."]],note:"어제 유형과 결정적으로 다른 점은 본문의 방향입니다. 여기서는 한쪽 관점을 한 문단, 다른쪽 관점을 다음 문단에서 각각 공정하게 먼저 다룹니다. 내 의견은 두 번째 문단의 끝과 결론에서 분명히 드러내요. 한쪽만 쓰면 질문의 절반만 답한 글이 되고, 내 의견을 끝까지 숨기면 그것도 감점입니다. 이 문장들도 '에세이 조립' 탭의 논의형 에세이와 같습니다. 양쪽을 다룬 뒤 내 의견을 밝히는 이 구조가 논의형(Discuss Both Views)입니다.",ex:[["mcq","builder","b38"],["mcq","builder","b34"],["order","builder","b46"],["order","builder","b29"]]},
{id:"w7d3",title:"장단점형 (Advantages & Disadvantages)",pat:"서론(두 방향 예고) → 본문 1: 장점 → 본문 2: 단점 → 결론(균형 정리)",models:[["Studying abroad has become an increasingly popular choice among young people in many countries. This essay will discuss the main advantages and disadvantages of this trend.","유학은 많은 나라의 젊은이들 사이에서 점점 더 인기 있는 선택이 되었습니다. 이 에세이는 이 추세의 주요 장점과 단점을 논의할 것입니다."],["The main advantage of studying abroad is that students can experience a different culture while they learn. However, studying abroad also has clear disadvantages.","유학의 가장 큰 장점은 학생들이 배우면서 다른 문화를 경험할 수 있다는 것입니다. 하지만 유학에는 분명한 단점도 있습니다."],["In conclusion, studying abroad offers valuable experience and better career opportunities. However, its high cost and emotional difficulties mean that it is not the best choice for everyone.","결론적으로, 유학은 귀중한 경험과 더 나은 취업 기회를 제공합니다. 하지만 높은 비용과 정서적 어려움 때문에 모든 사람에게 최선의 선택은 아닙니다."]],note:"서론을 보세요. 내 의견부터 못 박는 문장이 없습니다 — 대신 장점과 단점을 다 다루겠다는 예고(This essay will discuss ~)가 입장문의 역할을 합니다. 본문 1은 장점만, 본문 2는 단점만 모으고, 결론에서 어느 쪽으로도 단정하지 않고 균형을 정리해요. 한쪽 문단만 길어지면 균형이 깨진 글이라는 인상을 줍니다. 이 문장들은 새로 추가된 '에세이 조립'의 장단점형 에세이와 같습니다. 좋은 점과 나쁜 점을 같은 무게로 정리하는 이 구조가 장단점형입니다.",ex:[["mcq","builder","b39"],["mcq","builder","b47"],["order","builder","b42"],["para","para","p5"]]},
{id:"w7d4",title:"문제·해결형 (Problem & Solution)",pat:"서론(문제 + 로드맵) → 본문 1: 원인 → 본문 2: 해결책 → 결론(원인·해결 요약)",models:[["Traffic congestion has become a major problem in many large cities around the world. This essay will examine the main causes of this problem and suggest several possible solutions.","교통 혼잡은 전 세계 많은 대도시에서 심각한 문제가 되었습니다. 이 에세이는 이 문제의 주요 원인을 살펴보고 몇 가지 가능한 해결책을 제시할 것입니다."],["The main cause of congestion is that too many people rely on private cars for their daily travel. Several measures can be taken to deal with this problem.","혼잡의 주된 원인은 너무 많은 사람이 일상 이동에 자가용에 의존한다는 것입니다. 이 문제를 다루기 위해 취할 수 있는 조치가 몇 가지 있습니다."],["In conclusion, traffic congestion is mainly caused by the growth of private car use and weak public transport. By improving public transport and charging drivers in busy areas, cities can significantly reduce this problem.","결론적으로, 교통 혼잡은 주로 자가용 이용의 증가와 취약한 대중교통 때문에 생깁니다. 대중교통을 개선하고 혼잡 지역의 운전자에게 요금을 부과함으로써, 도시는 이 문제를 크게 줄일 수 있습니다."]],note:"본문 두 문단의 관계를 보세요. 본문 2의 해결책은 본문 1의 원인과 하나씩 짝을 이룹니다 — 원인이 '대중교통이 약하다'이면 해결책은 '대중교통 개선'입니다. 짝이 안 맞는 해결책을 나열하면 설득력을 잃어요. 그리고 이 유형에서는 장점·단점이나 내 찬반 의견을 쓰지 않습니다. 질문이 원인, 해결책 두 가지만 시켰기 때문이에요. 이 문장들은 '에세이 조립' 탭의 문제·해결형 에세이와 같습니다.",ex:[["mcq","builder","b40"],["order","builder","b43"],["order","builder","b30"],["order","builder","b15"]]},
{id:"w7d5",title:"이중질문형 (Two-part Question)",pat:"서론(질문 2개 예고) → 본문 1: 질문 1 답 → 본문 2: 질문 2 답 → 결론",models:[["In many countries, living alone is becoming increasingly common, especially among young adults and the elderly. This essay will explain the main reasons for this trend and discuss whether it is a positive or negative development.","많은 나라에서 혼자 사는 것이 점점 흔해지고 있으며, 특히 젊은 성인과 노인 사이에서 그렇습니다. 이 에세이는 이 추세의 주된 이유를 설명하고, 이것이 긍정적인 발전인지 부정적인 발전인지 논의할 것입니다."],["One main reason is that people now have more freedom to choose how they live. In my view, this trend is largely positive, although it has some drawbacks.","주된 이유 중 하나는 사람들이 이제 어떻게 살지 선택할 자유가 더 많아졌다는 것입니다. 제 생각에 이 추세는 단점도 일부 있지만 대체로 긍정적입니다."],["In conclusion, more people live alone mainly because they have greater freedom and more opportunities in cities. Overall, I believe this is a positive development, as long as people maintain close relationships with family and friends.","결론적으로, 더 많은 사람이 혼자 사는 주된 이유는 자유가 커지고 도시에서 기회가 많아졌기 때문입니다. 전반적으로, 사람들이 가족·친구와 가까운 관계를 유지하는 한 이것은 긍정적인 발전이라고 생각합니다."]],note:"질문이 두 개면 본문도 두 개 — 이 한 줄이 이 유형의 전부입니다. 본문 1은 첫 번째 질문(왜 이런 일이 일어나는가)에만, 본문 2는 두 번째 질문(긍정적인가)에만 답합니다. 두 질문을 한 문단에 섞으면 어느 쪽 답도 흐릿해져요. 서론의 두 번째 문장이 질문 두 개를 그대로 예고하고 있으니, 쓰기 전에 그 문장부터 확인하는 습관이 안전합니다. 이 문장들은 새로 추가된 '에세이 조립'의 이중질문형 에세이와 같습니다.",ex:[["mcq","builder","b41"],["mcq","paraphrase","pp10"],["order","builder","b44"],["mcq","builder","b35"]]}]},
{w:8,title:"결론과 전체 조립",desc:"문장→문단→에세이. 배운 것을 하나의 완성된 에세이로 조립하며 마무리합니다.",lessons:[
{id:"w8d1",title:"결론 — 입장의 압축",pat:"결론 = In conclusion, + 입장·요약 반복 (새 정보 금지)",models:[["In conclusion, I firmly believe that university education should be free for all students. It creates fairer opportunities for individuals and brings lasting benefits to society.","결론적으로, 저는 대학 교육이 모든 학생에게 무료여야 한다고 굳게 믿습니다. 이는 개인에게 더 공정한 기회를 만들고 사회에 지속적인 이익을 가져다줍니다."],["In conclusion, although competition has some value in education, cooperation is more important for children's long-term development. Schools should therefore focus mainly on teaching children how to work well with others.","결론적으로, 경쟁도 교육에서 어느 정도 가치가 있지만, 협력이 아이들의 장기적인 발달에 더 중요합니다. 따라서 학교는 아이들이 다른 사람과 잘 협력하는 법을 가르치는 데 주로 집중해야 합니다."],["In conclusion, traffic congestion is mainly caused by the growth of private car use and weak public transport. By improving public transport and charging drivers in busy areas, cities can significantly reduce this problem.","결론적으로, 교통 혼잡은 주로 자가용 이용의 증가와 취약한 대중교통 때문에 생깁니다. 대중교통을 개선하고 혼잡 지역의 운전자에게 요금을 부과함으로써, 도시는 이 문제를 크게 줄일 수 있습니다."]],note:"세 결론을 나란히 보세요. 전부 두 문장이고, 새 정보가 하나도 없습니다. 첫 문장은 서론에서 밝힌 입장이나 본문의 핵심을 짧게 다시 말하고, 두 번째 문장은 그 결과가 왜 중요한지, 무엇을 해야 하는지로 닫습니다. 유형이 달라도 모양은 같아요 — 의견형은 입장을, 논의형은 내 의견을, 문제·해결형은 원인·해결 쌍을 압축합니다. 반대로 결론에서 새 이유를 꺼내거나 입장을 바꾸면 글 전체의 일치가 깨져요. 에세이의 마지막 문단에 붙는 이름이 결론(conclusion)입니다.",ex:[["mcq","builder","b48"],["mcq","builder","b49"],["order","builder","b45"],["order","builder","b51"]]},
{id:"w8d2",title:"에세이 전체 조립 1 — 의견형",pat:"의견형 전체 = 서론(입장) → 이유 1 → 이유 2 → 결론(입장 반복)",models:[["It is often argued that university education should be provided free of charge for all students. I completely agree with this view because equal access to education benefits both individuals and society as a whole.","대학 교육은 모든 학생에게 무료로 제공되어야 한다고 자주 주장됩니다. 저는 이 견해에 완전히 동의합니다. 교육에 대한 평등한 접근은 개인과 사회 전체 모두에게 이익이 되기 때문입니다."],["The main reason for my view is that free university education gives everyone a fair chance to succeed. Another reason is that society as a whole gains from having more educated citizens.","제 견해의 주된 이유는 무료 대학 교육이 모든 사람에게 성공할 공정한 기회를 주기 때문입니다. 또 다른 이유는 사회 전체가 더 교육받은 시민들로부터 이익을 얻기 때문입니다."],["In conclusion, I firmly believe that university education should be free for all students. It creates fairer opportunities for individuals and brings lasting benefits to society.","결론적으로, 저는 대학 교육이 모든 학생에게 무료여야 한다고 굳게 믿습니다. 이는 개인에게 더 공정한 기회를 만들고 사회에 지속적인 이익을 가져다줍니다."]],note:"오늘은 문장 하나가 아니라 에세이 전체의 방향을 봅니다. 세 덩어리를 순서대로 읽어 보세요. 서론의 입장(completely agree)이 본문의 이유 두 개를 거쳐 결론(firmly believe)에서 같은 방향으로 돌아옵니다. 중간에 방향이 한 번도 바뀌지 않는 것이 의견형 전체 조립의 핵심이에요. 문제를 풀고 나면 '에세이 조립' 탭에서 의견형 에세이 16문장 전체를 직접 조립해 보세요 — 오늘 본 뼈대가 그대로 보일 겁니다.",ex:[["mcq","builder","b37"],["order","builder","b31"],["order","builder","b28"],["order","builder","b45"]]},
{id:"w8d3",title:"에세이 전체 조립 2 — 논의형·문제해결형",pat:"논의형 = 양쪽 관점 → 내 의견 · 문제·해결형 = 원인 → 해결 (짝 맞추기)",models:[["It is often debated whether children should be taught to compete or to cooperate with each other. While both skills are important, I believe that cooperation deserves greater emphasis in schools. On the one hand, competition can motivate children to work hard. On the other hand, cooperation teaches children to communicate and solve problems as a team. In conclusion, although competition has some value in education, cooperation is more important for children's long-term development.","아이들에게 경쟁을 가르쳐야 할지 협력을 가르쳐야 할지는 자주 논의됩니다. 두 능력 모두 중요하지만, 저는 협력이 학교에서 더 강조되어야 한다고 생각합니다. 한편으로 경쟁은 아이들이 열심히 노력하도록 동기를 부여할 수 있습니다. 반면에 협력은 아이들에게 소통하고 팀으로 문제를 해결하는 법을 가르칩니다. 결론적으로, 경쟁도 교육에서 어느 정도 가치가 있지만, 협력이 아이들의 장기적인 발달에 더 중요합니다."],["Traffic congestion has become a major problem in many large cities around the world. This essay will examine the main causes of this problem and suggest several possible solutions. The main cause of congestion is that too many people rely on private cars for their daily travel. Several measures can be taken to deal with this problem, starting with faster and more reliable public transport. In conclusion, traffic congestion is mainly caused by the growth of private car use and weak public transport.","교통 혼잡은 전 세계 많은 대도시에서 심각한 문제가 되었습니다. 이 에세이는 이 문제의 주요 원인을 살펴보고 몇 가지 가능한 해결책을 제시할 것입니다. 혼잡의 주된 원인은 너무 많은 사람이 일상 이동에 자가용에 의존한다는 것입니다. 이 문제를 다루기 위해 취할 수 있는 조치가 몇 가지 있으며, 더 빠르고 믿을 수 있는 대중교통이 그 시작입니다. 결론적으로, 교통 혼잡은 주로 자가용 이용의 증가와 취약한 대중교통 때문에 생깁니다."]],note:"두 에세이의 뼈대를 나란히 보세요. 논의형은 양쪽 관점을 먼저 공정하게 다룬 뒤 내 의견으로 닫고, 문제·해결형은 원인과 해결책을 짝으로 이어 간 뒤 그 짝을 압축해 닫습니다. 방향은 다르지만 공통점은 하나 — 서론에서 예고한 그대로 본문이 흘러가고, 결론이 그 흐름을 그대로 되받아 끝냅니다. 문제를 풀고 나면 '에세이 조립' 탭에서 논의형과 문제·해결형 에세이를 전체로 조립해 보세요.",ex:[["mcq","builder","b38"],["mcq","builder","b40"],["order","builder","b46"],["order","builder","b51"]]},
{id:"w8d4",title:"내 약점 집중 복습",pat:"자주 틀리는 4곳 = 조각 문장 · 주어-동사 일치 · if 절의 will · 청크 짝꿍",models:[["Although online learning is convenient, some students prefer face-to-face classes.","온라인 학습은 편리하지만, 일부 학생은 대면 수업을 선호합니다."],["If governments invest in public transport, traffic will decrease.","정부가 대중교통에 투자하면 교통량이 줄어들 것입니다."],["The number of students increases every year, and schools play a key role in their future.","학생 수가 매년 증가하고, 학교는 그들의 미래에 핵심적인 역할을 합니다."]],note:"오늘 모델 세 문장에는 이 코스에서 가장 자주 틀리는 지점이 하나씩 들어 있습니다. Although 덩어리를 마침표로 끊지 않는 것, If 덩어리 안에 will을 넣지 않는 것, 주어가 단수면 동사도 단수(increases)로 맞추는 것, 그리고 play a key role in 같은 청크를 짝꿍째로 쓰는 것이에요. 오늘 문제는 네 영역에서 골고루 섞어 냈습니다. 틀린 문제는 복습 큐에 다시 들어가니, 끝나면 '내 기록'에서 복습 큐가 몇 개인지 확인해 보세요.",ex:[["mcq","clinic","c6"],["mcq","clinic","c2"],["mcq","builder","b19"],["mcq","chunk","k1"]]},
{id:"w8d5",title:"최종 점검 — 6.0 체크리스트",pat:"최종 점검 = 입장 일치 → 문단 뼈대(주제문) → 문장 완성(주어+동사) → 결론 새 정보 없음",models:[["Regular exercise provides several important benefits for both the body and the mind. Firstly, it strengthens the body and reduces the risk of disease.","규칙적인 운동은 몸과 마음 모두에 몇 가지 중요한 이점을 제공합니다. 첫째, 운동은 몸을 튼튼하게 하고 질병의 위험을 줄입니다."],["It is often argued that university education should be provided free of charge for all students. I completely agree with this view because equal access to education benefits both individuals and society as a whole.","대학 교육은 모든 학생에게 무료로 제공되어야 한다고 자주 주장됩니다. 저는 이 견해에 완전히 동의합니다. 교육에 대한 평등한 접근은 개인과 사회 전체 모두에게 이익이 되기 때문입니다."],["In conclusion, I firmly believe that university education should be free for all students. It creates fairer opportunities for individuals and brings lasting benefits to society.","결론적으로, 저는 대학 교육이 모든 학생에게 무료여야 한다고 굳게 믿습니다. 이는 개인에게 더 공정한 기회를 만들고 사회에 지속적인 이익을 가져다줍니다."]],note:"마지막 레슨입니다. 위 세 덩어리는 한 에세이의 재료(주제문)와 시작(서론), 끝(결론)이에요. 제출 전에 눈으로 훑을 순서는 딱 세 단계입니다. 첫째, 서론의 입장과 결론의 입장이 같은 말을 하는지 확인합니다. 둘째, 본문 문단마다 첫 문장(주제문)만 읽어 뼈대가 이어지는지 봅니다. 셋째, 문장마다 주어와 동사가 있는지, 마침표로 끊긴 조각이 없는지 훑습니다. 어려운 단어를 더 넣거나 결론에 새 이유를 더하는 일은 하지 마세요 — 이 마지막 단계의 이름은 최종 점검(checklist 확인)입니다.",ex:[["mcq","builder","b50"],["mcq","builder","b48"],["order","builder","b52"],["order","builder","b53"]]}]}
];

/* ============ POOLS / STATE ============ */
const byId=(arr)=>Object.fromEntries(arr.map(x=>[x.id,x]));
const MCQ={clinic:byId(CLINIC),builder:byId(BUILDER_MCQ),chunk:byId(CHUNKS),paraphrase:byId(PARAPHRASE),diag:byId(DIAG)};
const ORD={builder:byId(BUILDER_ORDER),para:byId(PARA)};
const KEY="bandjump-v1";
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.lessons=S.lessons||{};S.res=S.res||{};S.review=S.review||{};S.days=S.days||[];S.diag=S.diag||null;S.asm=S.asm||{};S.rlog=S.rlog||[];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function touchDay(){const t=todayStr();if(!S.days.includes(t)){S.days.push(t);save()}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
const app=document.getElementById("app");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffledIdx(n){const o=shuffle(Array.from({length:n},(_,i)=>i));if(n>1&&o.every((v,i)=>v===i)){const t=o[0];o[0]=o[1];o[1]=t}return o}
function recordResult(pool,id,correct){
  const k=pool+":"+id;const prev=S.res[k];
  S.res[k]={r:correct?1:0,tries:(prev?prev.tries:0)+1};
  const now=Date.now();
  if(!correct){S.review[k]={due:now+86400000,stage:0}}
  else if(S.review[k]){const r=S.review[k];r.stage=(r.stage||0)+1;if(r.stage>=3){delete S.review[k]}else{r.due=now+(r.stage===1?3:7)*86400000}}
  touchDay();save();
}
function dueReviews(){const now=Date.now();return Object.keys(S.review).filter(k=>S.review[k].due<=now)}
function exFromKey(k){const[pool,id]=k.split(":");if(pool==="step"&&STEP[id])return["step","step",id];if(MCQ[pool]&&MCQ[pool][id])return["mcq",pool,id];if(ORD[pool]&&ORD[pool][id])return pool==="para"?["para",pool,id]:["order",pool,id];return null}
function mastery(pool){const items=pool==="builder"?BUILDER_MCQ.concat(BUILDER_ORDER):(MCQ[pool]?Object.values(MCQ[pool]):Object.values(ORD[pool]||{}));let ok=0;items.forEach(it=>{const r=S.res[pool+":"+it.id];if(r&&r.r===1)ok++});return{ok,total:items.length}}
function allLessons(){const out=[];WEEKS.forEach(w=>w.lessons.forEach(l=>out.push({w:w.w,l})));return out}
function nextLesson(){return allLessons().find(x=>x.l.ready!==false&&!S.lessons[x.l.id])||allLessons().find(x=>x.l.ready!==false)}
function streak(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(todayStr()))d.setDate(d.getDate()-1);while(set.has(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))){n++;d.setDate(d.getDate()-1)}return n}
function lessonAfter(id){const all=allLessons().filter(x=>x.l.ready!==false);const i=all.findIndex(x=>x.l.id===id);return i>=0&&i<all.length-1?all[i+1]:null}
function nextDueInfo(){const ks=Object.keys(S.review);if(!ks.length)return null;let min=Infinity;ks.forEach(k=>{if(S.review[k].due<min)min=S.review[k].due});return{count:ks.length,earliest:min}}
function fmtDay(ts){const d=new Date(ts);const now=new Date();const tom=new Date(Date.now()+86400000);const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();if(same(d,now))return"오늘";if(same(d,tom))return"내일";return(d.getMonth()+1)+"월 "+d.getDate()+"일"}
function fmtMD(ts){const d=new Date(ts);return(d.getMonth()+1)+"월 "+d.getDate()+"일"}
function weekStartTs(ts){const d=new Date(ts||Date.now());d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function dayStrOf(ts){const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function weekStats(){const start=weekStartTs();const startStr=dayStrOf(start);const lessons=Object.values(S.lessons).filter(v=>v&&typeof v.at==="number"&&v.at>=start).length;const days=S.days.filter(s=>s>=startStr).length;const reviews=(S.rlog||[]).filter(t=>typeof t==="number"&&t>=start).length;return{start,lessons,days,reviews}}

/* ============ SESSION RUNNER ============ */
let SES=null;
function startSession(title,exercises,onFinish,opts){
  opts=opts||{};SES={title,exercises:exercises.filter(e=>exFromKey(e[1]+":"+e[2])),i:0,correct:0,onFinish,reviewMode:!!opts.reviewMode,back:opts.back||"train"};
  if(!SES.exercises.length){SES=null;app.innerHTML='<div class="card" style="text-align:center"><div style="font-size:40px">🌿</div><h2>지금 풀 문제가 없어요</h2><p class="small">선택한 훈련에 준비된 문제가 아직 없습니다. 레슨을 먼저 풀면 틀린 문제가 복습으로 쌓이고, 훈련장 문제도 채워집니다.</p></div><button class="btn" onclick="go(\'train\')">코스에서 레슨 시작하기</button><button class="btn ghost" style="margin-top:8px" onclick="go(\'home\')">홈으로</button>';window.scrollTo(0,0);return}
  renderExercise();
}
function renderExercise(){
  const[kind,pool,id]=SES.exercises[SES.i];
  const head='<button class="back" onclick="quitSession()">‹ 그만하기</button><div class="prog">'+esc(SES.title)+' · '+(SES.i+1)+' / '+SES.exercises.length+'</div>';
  if(kind==="mcq")renderMCQ(head,pool,MCQ[pool][id]);
  else if(kind==="order")renderOrder(head,ORD[pool][id].tokens,"order",pool,id);
  else if(kind==="para"){const p=ORD.para[id];renderPara(head,p)}
  else if(kind==="step")renderStep(head,STEP[id]);
}
function finishExercise(correct){
  const[kind,pool,id]=SES.exercises[SES.i];
  if(SES.reviewMode){S.rlog=S.rlog||[];S.rlog.push(Date.now());if(S.rlog.length>1000)S.rlog=S.rlog.slice(-1000)}
  recordResult(pool,id,correct);
  if(correct)SES.correct++;
  SES.i++;
  if(SES.i>=SES.exercises.length){const f=SES.onFinish,c=SES.correct,t=SES.exercises.length;SES=null;f&&f(c,t)}
  else renderExercise();
}
function quitSession(){const b=SES?SES.back:"train";SES=null;go(b)}
function lockPickers(){app.querySelectorAll(".chip,.sent").forEach(b=>{b.disabled=true});app.querySelectorAll(".pchip,.fchunk").forEach(b=>{b.disabled=true});["undoBtn","rstBtn","chkBtn"].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true})}
function mcqPrompt(pool,item){
  if(pool==="clinic")return{t:"문장 수술실 · "+item.cat,q:"가장 올바른 문장은 어느 것인가요?"};
  if(pool==="builder")return item.q?{t:(item.link.includes("구조")?"에세이 구조 · ":"입장문 · ")+item.link,q:item.q}:{t:"문장 키우기 · "+item.link,q:"두 문장을 바르게 합친 것은 어느 것인가요?"};
  if(pool==="chunk")return{t:"토픽 청크 · "+item.topic,q:"빈칸에 들어가면 표현이 완성되는 단어는?"};
  if(pool==="paraphrase")return{t:"패러프레이즈",q:"아래 문장을 가장 잘 바꿔 쓴 것은?"};
  if(pool==="diag")return{t:"진단",q:item.q||"가장 올바른 문장은 어느 것인가요?"};
  return{t:"",q:""};
}
function renderMCQ(head,pool,item){
  const p=mcqPrompt(pool,item);
  const order=shuffle(item.opts.map((o,i)=>({o,i})));
  let html=head+'<div class="card"><span class="tag">'+esc(p.t)+'</span><div class="q">'+esc(p.q)+"</div>";
  if(pool==="paraphrase"||pool==="diag"&&item.q) { if(pool==="paraphrase")html+='<div class="qen">'+esc(item.q)+"</div>"; }
  if(pool==="chunk")html+='<div class="qen">'+esc(item.s)+"</div>";
  html+='<div id="opts">';
  order.forEach(({o,i})=>{html+='<button class="opt" data-i="'+i+'">'+esc(o)+"</button>"});
  html+='</div><div id="fb" aria-live="polite"></div></div>';
  app.innerHTML=html;window.scrollTo(0,0);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const chosen=+b.dataset.i;const correct=chosen===item.a;
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===item.a)x.classList.add("correct")});
    if(!correct)b.classList.add("wrong");
    document.getElementById("fb").innerHTML='<div class="why '+(correct?"ok":"no")+'"><b>'+(correct?"정답이에요.":"아쉬워요. 정답을 확인하세요.")+"</b><br>"+esc(item.why||"")+(item.pat?'<div class="pattern">🔑 '+esc(item.pat)+"</div>":"")+(item.ko?'<div class="pattern">🔑 '+esc(item.ko)+"</div>":"")+'</div><button class="btn" id="nextBtn">'+(SES.i+1>=SES.exercises.length?"결과 보기":"다음 문제")+"</button>";
    document.getElementById("nextBtn").onclick=()=>finishExercise(correct);
  });
}

function renderStep(head,item){
  if(item.t==="repro")renderRepro(head,item);
  else if(item.t==="fill")renderFill(head,item);
  else if(item.t==="fix")renderFix(head,item);
}
function nextBtnHTML(){return '<button class="btn" id="nextBtn">'+(SES.i+1>=SES.exercises.length?"결과 보기":"다음")+"</button>"}
function renderRepro(head,item){
  const tokens=item.tokens;
  let html=head+'<div class="card"><span class="tag rose">재현 — 보고, 가리고, 다시 만들기</span><div class="q">이 문장을 잘 읽어두세요. 외우라는 게 아니라, 모양을 눈에 담는 거예요.</div><div class="qen">'+esc(item.en)+'<div style="color:var(--sub);font-size:14px;margin-top:4px">'+esc(item.ko)+'</div></div><button class="btn" id="hideBtn">가리고 직접 만들기</button></div>';
  app.innerHTML=html;window.scrollTo(0,0);
  document.getElementById("hideBtn").onclick=()=>{
    let picked=[];const reproOrder=shuffle(item.tokens.map((t,i)=>i));
    const draw=()=>{
      const used=new Set(picked);
      let h=head+'<div class="card"><span class="tag rose">재현 — 다시 만들기</span><div class="q">방금 본 문장을 조각으로 다시 만들어보세요</div><p class="small">뜻: '+esc(item.ko)+'</p><div class="built">'+(picked.length?picked.map((ti,pos)=>'<button class="pchip" data-p="'+pos+'">'+esc(tokens[ti])+"</button>").join(""):'<span class="small">조각을 탭하면 여기에 쌓여요. 놓은 조각을 다시 탭하면 돌아갑니다</span>')+'</div><div class="chips">';
      reproOrder.forEach(i=>{h+='<button class="chip'+(used.has(i)?" used":"")+'" data-i="'+i+'">'+esc(tokens[i])+"</button>"});
      h+='</div><div class="btnrow"><button class="btn" id="chkBtn" '+(picked.length===tokens.length?"":"disabled")+">원본과 비교하기</button></div>"+'<div id="fb"></div></div>';
      app.innerHTML=h;
      app.querySelectorAll(".chip:not(.used)").forEach(c=>c.onclick=()=>{picked.push(+c.dataset.i);draw()});
      app.querySelectorAll(".pchip").forEach(c=>c.onclick=()=>{picked.splice(+c.dataset.p,1);draw()});
      const k=document.getElementById("chkBtn");if(k)k.onclick=()=>{
        const mine=picked.map(i=>tokens[i]).join(" ");
        const correct=mine===item.en;
        lockPickers();
        document.getElementById("fb").innerHTML=(correct
          ?'<div class="why ok"><b>원본과 똑같아요. 방금 이 문장을 머릿속에서 꺼내 만든 거예요 — 그게 실력이에요.</b></div>'
          :'<div class="cmp mine"><b class="lab">내가 만든 문장</b>'+esc(mine)+'</div><div class="cmp orig"><b class="lab">원본</b>'+esc(item.en)+'</div><div class="why no"><b>어디가 달랐는지 눈으로 확인하세요. 이 차이를 보는 게 재현 훈련의 핵심이에요.</b></div>')
          +(item.pat?'<div class="pattern">🔑 '+esc(item.pat)+"</div>":"")+nextBtnHTML();
        document.getElementById("nextBtn").onclick=()=>finishExercise(correct);
      };
    };draw();
  };
}
function renderFill(head,item){

function renderFix(head,item){
  let firstTap=null,donePick=false;

  app.innerHTML=html;window.scrollTo(0,0);
  app.querySelectorAll(".fchunk").forEach(b=>b.onclick=()=>{
    if(donePick)return;const i=+b.dataset.i;

    if(firstTap===null)firstTap=true;
    b.classList.add("hit");
    app.querySelectorAll(".fchunk").forEach(x=>x.disabled=true);
    let oh='<div class="q" style="margin-top:12px">찾았어요. 이 덩어리를 무엇으로 바꾸면 문장이 완성될까요?</div>';
    shuffle(item.opts.map((o,oi)=>({o,oi}))).forEach(({o,oi})=>{oh+='<button class="opt" data-i="'+oi+'">'+esc(o)+"</button>"});

    app.querySelectorAll("#fixOpts .opt").forEach(ob=>ob.onclick=()=>{
      if(donePick)return;donePick=true;const pick=+ob.dataset.i;
      app.querySelectorAll("#fixOpts .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===item.a)x.classList.add("correct")});

      document.getElementById("fb").innerHTML='<div class="why '+(correct?"ok":"no")+'"><b>'+(correct?"찾아서 고쳤어요. 남의 문장을 고치는 눈이 생기면, 내 문장의 오류도 보이기 시작합니다.":"고치긴 했어요. 정답 흐름을 확인하세요.")+'</b><br><span class="qen" style="display:block">'+esc(item.fixed)+"</span>"+esc(item.why)+"</div>"+nextBtnHTML();
      document.getElementById("nextBtn").onclick=()=>finishExercise(correct);
    });
  });

function renderOrder(head,tokens,kind,pool,id){

    chipOrder.forEach(i=>{html+='<button class="chip'+(used.has(i)?" used":"")+'" data-i="'+i+'">'+esc(tokens[i])+"</button>"});

    const k2=document.getElementById("chkBtn");if(k2)k2.onclick=()=>{
      const correct=picked.every((v,idx)=>v===idx);
      document.getElementById("fb").innerHTML='<div class="why '+(correct?"ok":"no")+'"><b>'+(correct?"완벽해요. 이 문장 모양을 통째로 기억하세요.":"순서가 달라요. 정답 문장을 소리 내어 읽어보세요.")+'</b><br><span class="qen" style="display:block">'+esc(tokens.join(" "))+"</span>"+esc(item.why||"")+(item.pat?'<div class="pattern">🔑 '+esc(item.pat)+"</div>":"")+'</div><button class="btn" id="nextBtn">'+(SES.i+1>=SES.exercises.length?"결과 보기":"다음 문제")+"</button>";
      document.getElementById("nextBtn").onclick=()=>finishExercise(correct);
      lockPickers();
    };
  };draw();
}

  if(due){html+='<button class="btn teal" style="margin-top:8px" onclick="startReview()">복습 '+due+'문제 먼저 하기</button>'}
  html+='<button class="btn ghost" style="margin-top:8px" onclick="go(\'train\')">코스 목록으로</button>';
  app.innerHTML=html;window.scrollTo(0,0);
}
function findLesson(id){for(const w of WEEKS){const l=w.lessons.find(x=>x.id===id);if(l)return{w:w.w,l}}return null}
function startLesson(id){
  const f=findLesson(id);if(!f)return;const{w,l}=f;
  let html='<button class="back" onclick="go(\'train\')">‹ 코스</button><div class="card"><span class="tag">'+w+'주차 레슨</span><h2>'+esc(l.title)+'</h2><p class="small" style="margin-bottom:10px">먼저 모델 문장 3개를 읽어보세요. 문장을 탭하면(키보드는 Enter) 뜻이 보입니다. 규칙은 아직 몰라도 돼요 — 공통된 모양이 눈에 들어오는지 느껴보세요.</p>';
  l.models.forEach(m=>{html+='<div class="qen" role="button" tabindex="0" data-kb aria-expanded="false" aria-label="모델 문장 뜻 보기" style="cursor:pointer" onclick="var k=this.querySelector(\'.ko\');k.classList.toggle(\'hidden\');this.setAttribute(\'aria-expanded\',k.classList.contains(\'hidden\')?\'false\':\'true\')">'+esc(m[0])+'<div class="ko hidden" style="color:var(--sub);font-size:14px;margin-top:4px">'+esc(m[1])+"</div></div>"});
  const stepList=l.steps||l.ex;html+='<div class="pattern">🔑 오늘의 패턴: <b>'+esc(l.pat)+'</b></div><p class="small" style="margin-top:10px;line-height:1.7">'+esc(l.note)+'</p><br><button class="btn" id="goEx">'+(l.steps?'이제 직접 만들어보기':'이제 문제로 확인하기')+' ('+stepList.length+'단계)</button></div>';
  app.innerHTML=html;window.scrollTo(0,0);
  document.getElementById("goEx").onclick=()=>{
    startSession(l.title,stepList.map(e=>[e[0],e[1],e[2]]),(c,t)=>{
      S.lessons[id]={score:c,total:t,at:Date.now()};save();
      renderLessonResult(id,c,t);
    });
  };
}
function startFree(pool){
  let ex=[];
  if(pool==="builder"){ex=BUILDER_MCQ.map(x=>["mcq","builder",x.id]).concat(BUILDER_ORDER.map(x=>["order","builder",x.id]))}
  else if(pool==="para"){ex=PARA.map(x=>["para","para",x.id])}
  else{ex=Object.values(MCQ[pool]).map(x=>["mcq",pool,x.id])}
  ex=shuffle(ex);
  const wrongFirst=ex.sort((a,b)=>{const ra=S.res[a[1]+":"+a[2]],rb=S.res[b[1]+":"+b[2]];return((ra&&ra.r===1)?1:0)-((rb&&rb.r===1)?1:0)});
  startSession("자유 훈련",wrongFirst.slice(0,8),(c,t)=>sessionResult("훈련 완료",c,t,"train"));
}
function startReview(){
  const keys=dueReviews();
  if(!keys.length){
    const info=nextDueInfo();
    app.innerHTML='<div class="card" style="text-align:center"><div style="font-size:40px">🌿</div><h2>오늘 복습할 문제가 없어요</h2><p class="small">'+(info?("대기 중인 복습 "+info.count+"개는 <b>"+fmtDay(info.earliest)+"</b>에 열립니다. 잊을 만할 때 다시 만나는 것이 간격 반복의 핵심이라, 미리 풀 수는 없어요."):("틀린 문제가 생기면 자동으로 복습 일정이 잡힙니다. 지금은 새 레슨을 이어가면 됩니다."))+'</p></div><button class="btn" onclick="go(\'train\')">코스로 가기</button><button class="btn ghost" style="margin-top:8px" onclick="go(\'home\')">홈으로</button>';
    window.scrollTo(0,0);return;
  }
  const ex=keys.map(exFromKey).filter(Boolean);
  startSession("간격 반복 복습",shuffle(ex).slice(0,10),(c,t)=>sessionResult("복습 완료",c,t,"home"),{reviewMode:true,back:"home"});
}
function startDiag(){
  const ex=DIAG.map(d=>["mcq","diag",d.id]);
  startSession("시작 진단",ex,(c,t)=>{
    const scores={};DIAG.forEach(d=>{const r=S.res["diag:"+d.id];scores[d.crit]=scores[d.crit]||{ok:0,n:0};scores[d.crit].n++;if(r&&r.r===1)scores[d.crit].ok++});
    S.diag={at:Date.now(),scores};save();
    const names={TR:"과제 응답 (질문이 시키는 대로 쓰기)",CC:"구성·연결 (문단 뼈대와 흐름)",LR:"어휘 (짝꿍 표현과 정확한 단어)",GRA:"문법 (문장 정확도와 복문)"};
    let rows="";let weakest=null,wv=Infinity;
    Object.keys(names).forEach(k=>{const s=scores[k]||{ok:0,n:1};const p=Math.round(s.ok/s.n*100);if(p<wv){wv=p;weakest=k}rows+='<div class="metric"><span>'+names[k]+'</span><b>'+p+"%</b></div>"});
    const advice={GRA:"문장 정확도부터 잡아야 합니다. 1주차부터 순서대로 시작하세요.",CC:"문장보다 문단의 흐름이 약점이에요. 그래도 1~3주차 문장 훈련 뒤 4주차에서 크게 오릅니다.",LR:"표현의 짝꿍(콜로케이션)이 약점이에요. 6주차 청크 훈련이 특히 도움이 됩니다.",TR:"질문을 정확히 읽는 게 약점이에요. 5주차(서론)와 7주차(유형별)가 핵심입니다."};
    const focus=wv>=100?'<b>네 기준 모두 만점이에요 — 이 진단에서는 약점이 드러나지 않았습니다.</b><br>진단은 시작점을 확인하는 12문항이라, 실제 약점은 코스를 진행하며 푸는 문제에서 더 정확히 드러납니다.':'<b>가장 먼저 잡을 곳: '+names[weakest]+'</b><br>'+advice[weakest];
    app.innerHTML='<div class="card"><h2>진단 결과</h2>'+rows+'<div class="why ok" style="margin-top:12px">'+focus+'<br><br>그래도 코스는 1주차부터 순서대로 가세요. 이 앱의 레슨은 앞 레슨이 뒷 레슨의 재료가 되도록 쌓여 있습니다.</div></div><button class="btn" onclick="startLesson(\'w1d1\')">1주차 첫 레슨 시작하기</button>';
    window.scrollTo(0,0);
  },{back:"home"});
}
function renderAssemblyList(){
  let html='<div class="card"><h2>에세이 조립</h2><p class="small">완성된 Band 6.5 에세이(각 250단어 이상 — 실제 시험 최소 분량)를 문장 단위로 섞어 두었습니다. 순서대로 조립하면서 에세이 전체의 뼈대를 몸으로 익히세요. 직접 쓰는 게 아니라, 좋은 글의 구조를 읽고 맞히는 훈련입니다.</p></div>';
  ASSEMBLY.forEach(a=>{
    html+='<div class="card"><span class="tag teal">'+esc(a.type)+'</span><h3>'+esc(a.q)+'</h3><p class="small">문장 '+a.s.length+'개 조립 · '+a.s.join(" ").split(/\s+/).length+'단어 · 문단 4개</p><br><button class="btn" onclick="startAssembly(\''+a.id+'\')">'+(S.asm[a.id]?"다시 조립하기":"조립 시작")+"</button></div>";
  });
  app.innerHTML=html;
}
function startAssembly(id){
  const a=ASSEMBLY.find(x=>x.id===id);let picked=[];
  const sentOrder=shuffledIdx(a.s.length);
  let first=true;
  const draw=()=>{
    const sy=window.scrollY;
    let html='<button class="back" onclick="go(\'write\')">‹ 에세이 조립</button><div class="card"><span class="tag teal">'+esc(a.type)+'</span><div class="qen">'+esc(a.q)+'</div><div class="q">문장은 섞여 있어요. 서론 → 본문 1 → 본문 2 → 결론 순서로 문장을 탭하세요</div>';
    sentOrder.forEach(i=>{const s=a.s[i];const idx=picked.indexOf(i);html+='<button class="sent'+(idx>=0?" picked":"")+'" data-i="'+i+'">'+(idx>=0?("<b>"+(idx+1)+".</b> "):"")+esc(s)+"</button>"});
    html+='<div class="btnrow"><button class="btn ghost" id="rstBtn">처음부터</button><button class="btn" id="chkBtn" '+(picked.length===a.s.length?"":"disabled")+">확인</button></div>"+'<div id="fb" aria-live="polite"></div></div>';
    app.innerHTML=html;window.scrollTo(0,first?0:sy);first=false;
    app.querySelectorAll(".sent").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const at=picked.indexOf(i);if(at>=0)picked.splice(at,1);else picked.push(i);draw()});
    document.getElementById("rstBtn").onclick=()=>{picked=[];draw()};
    document.getElementById("chkBtn").onclick=()=>{
      const correct=picked.every((v,idx)=>v===idx);
      S.asm[id]={done:true,perfect:correct,at:Date.now()};save();
      let full="";let partIdx=0;
      a.s.forEach((s,i)=>{if(i===0||a.breaks.includes(i)){full+='<p style="margin:12px 0 4px"><span class="tag">'+esc(a.parts[partIdx++])+"</span></p>"}full+="<p style='margin:2px 0'>"+esc(s)+"</p>"});
      const idx=ASSEMBLY.findIndex(x=>x.id===id);const nxt=idx>=0?ASSEMBLY[idx+1]:null;
      const allDone=ASSEMBLY.every(x=>S.asm[x.id]&&S.asm[x.id].done);
      let nav="";
      if(allDone&&!nxt)nav+='<p class="small" style="margin-top:10px"><b>🎉 에세이 6편을 모두 조립했어요.</b> 이제 틀렸던 문제는 복습으로, 전체 구조는 다시 조립하며 굳히면 됩니다.</p>';
      nav+='<div style="margin-top:12px">';
      if(nxt)nav+='<button class="btn" id="asmNext">다음 에세이 조립하기 ›</button>';
      else nav+='<button class="btn" id="asmList">에세이 목록으로</button>';
      if(!correct)nav+='<button class="btn teal" style="margin-top:8px" id="asmRetry">이 에세이 다시 조립하기</button>';
      if(nxt)nav+='<button class="btn ghost" style="margin-top:8px" id="asmList">에세이 목록으로</button>';
      nav+="</div>";
      document.getElementById("fb").innerHTML='<div class="why '+(correct?"ok":"no")+'"><b>'+(correct?"완벽합니다. 에세이 한 편의 뼈대를 통째로 조립했어요.":"조립 완료. 아래 완성본과 순서를 비교해 보세요.")+"</b><br>"+esc(a.band)+'</div><div class="card" style="margin:10px 0 0">'+full+"</div>"+nav;
      lockPickers();
      const an=document.getElementById("asmNext");if(an)an.onclick=()=>startAssembly(nxt.id);
      const ar=document.getElementById("asmRetry");if(ar)ar.onclick=()=>startAssembly(id);
      const al=document.getElementById("asmList");if(al)al.onclick=()=>go("write");
    };
  };draw();
}
function renderMy(){
  const names=[["clinic","문장 수술실"],["builder","문장 키우기"],["para","문단 조립"],["paraphrase","패러프레이즈"],["chunk","토픽 청크"]];
  let html='<div class="card"><h2>내 기록</h2><div class="kpi"><div><b>'+streak()+'일</b><span>연속</span></div><div><b>'+S.days.length+'일</b><span>누적 학습일</span></div><div><b>'+Object.keys(S.lessons).length+'개</b><span>완료 레슨</span></div></div>'+(Object.keys(S.lessons).length?'':'<p class="small" style="margin-top:6px">아직 완료한 레슨이 없어요. 아래 막대는 레슨과 훈련을 풀수록 채워집니다 — 1주차 첫 레슨부터 가볍게 시작해 보세요.</p><button class="btn" style="margin-top:10px" onclick="startLesson(\'w1d1\')">첫 레슨 시작하기</button>');
  names.forEach(([p,n])=>{const m=mastery(p);const pct=m.total?Math.round(m.ok/m.total*100):0;html+="<div style='margin:10px 0'><div style='display:flex;justify-content:space-between;font-size:14px'><span>"+n+"</span><b>"+m.ok+" / "+m.total+"</b></div><div class='bar'><i style='width:"+pct+"%'></i></div></div>"});
  html+="</div>";
  const rev=Object.keys(S.review);const dueN=dueReviews().length;const info=nextDueInfo();
  if(dueN){html+='<div class="card"><h2>복습 큐</h2><p class="small">오늘 복습할 문제 <b>'+dueN+'개</b>가 기다리고 있어요. 전체 대기 중인 문제는 '+rev.length+'개입니다.</p><br><button class="btn teal" onclick="startReview()">복습 시작 ('+dueN+'문제)</button></div>'}
  else if(rev.length){html+='<div class="card"><h2>복습 큐</h2><p class="small">오늘 도래한 복습은 없어요. 대기 중인 '+rev.length+'개는 <b>'+(info?fmtDay(info.earliest):"")+'</b>부터 차례로 열립니다. 맞힐 때마다 간격이 3일, 7일로 늘어나요.</p><br><button class="btn" onclick="go(\'train\')">대신 새 레슨 하러 가기</button></div>'}
  else{html+='<div class="card" style="text-align:center"><div style="font-size:36px">🌿</div><h2>복습 큐가 비어 있어요</h2><p class="small">좋은 신호예요 — 아직 다시 볼 문제가 없다는 뜻입니다. 문제를 틀리면 그 문제가 자동으로 여기에 들어와 다음 날부터 다시 만나게 됩니다.</p><br><button class="btn" onclick="go(\'train\')">레슨 하러 가기</button></div>'}
  if(S.diag){html+='<div class="card"><h2>진단 기록</h2><p class="small">'+new Date(S.diag.at).toLocaleDateString("ko-KR")+' 진단 완료</p><br><button class="btn ghost" onclick="startDiag()">다시 진단하기</button></div>'}
  else{html+='<div class="card"><h2>진단 기록</h2><p class="small">아직 진단 기록이 없어요. 12문제로 지금 약한 평가기준(TR·CC·LR·GRA)부터 확인하면 코스를 더 효율적으로 돌 수 있습니다.</p><br><button class="btn ghost" onclick="startDiag()">진단 시작하기</button></div>'}
  html+='<div class="card"><h2>처음부터 다시 시작</h2><p class="small">모든 진도와 기록을 지웁니다.</p><br><button class="btn ghost" style="border-color:var(--bad);color:var(--bad)" onclick="if(confirm(\'정말 모든 기록을 지울까요?\')){localStorage.removeItem(KEY);location.reload()}">기록 초기화</button></div>';
  app.innerHTML=html;
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
go("home");
