<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Band Jump — IELTS Writing 4.5 → 6.0</title>
<meta name="description" content="Band 4.5를 6.0으로: 의미를 막는 오류를 없애고, 안정적인 복문과 문단 뼈대를 몸에 붙이는 IELTS 라이팅 트레이너">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4338ca">
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#1e1b2e;--sub:#6b7280;--bg:#f6f6fb;--card:#fff;--brand:#4338ca;--brand2:#7c3aed;--teal:#0d9488;--amber:#d97706;--rose:#e11d48;--line:#e7e5f0;--ok:#059669;--bad:#dc2626;--radius:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
#wrap{max-width:540px;margin:0 auto;padding:0 16px 110px}
header{padding:22px 4px 8px}
.logo{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--brand)}
h1{font-size:26px;font-weight:900;line-height:1.25;margin:4px 0 6px}
h1 .grad{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0;box-shadow:0 2px 10px rgba(67,56,202,.05)}
.card h2{font-size:17px;font-weight:800;margin-bottom:6px}
.card h3{font-size:15px;font-weight:800;margin-bottom:4px}
.small{font-size:13px;color:var(--sub)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;text-align:center}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.btn.teal{background:var(--teal)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px}.btnrow .btn{flex:1}
.journey{background:linear-gradient(135deg,#312e81,#6d28d9);color:#fff;border:0}
.journey .track{height:10px;background:rgba(255,255,255,.25);border-radius:99px;margin:14px 0 6px;overflow:hidden}
.journey .fill{height:100%;background:#fbbf24;border-radius:99px;transition:width .5s}
.journey .marks{display:flex;justify-content:space-between;font-size:12px;opacity:.9}
.mod{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.mod:last-child{border-bottom:0}
.mod .ic{font-size:26px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:#eef2ff;border-radius:14px;flex:none}
.mod .grow{flex:1;min-width:0}
.mod .t{font-weight:800;font-size:15px}
.mod .d{font-size:12.5px;color:var(--sub)}
.mod .pct{font-weight:900;color:var(--brand);font-size:15px}
.bar{height:7px;background:#eceaf6;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 15px;font-size:15.5px;margin:9px 0;cursor:pointer;line-height:1.5}
.opt:hover{border-color:#c7c2ea}
.opt.correct{border-color:var(--ok);background:#ecfdf5}
.opt.wrong{border-color:var(--bad);background:#fef2f2}
.opt:disabled{cursor:default;opacity:.92}
.q{font-size:17px;font-weight:700;line-height:1.6;margin:8px 0 4px}
.qen{font-size:16.5px;line-height:1.65;background:#f5f3ff;border:1px solid #e9e5ff;border-radius:12px;padding:13px 14px;margin:10px 0}
.why{border-radius:12px;padding:13px 14px;margin:12px 0;font-size:14.5px;line-height:1.6}
.why.ok{background:#ecfdf5;border:1px solid #a7f3d0}
.why.no{background:#fef2f2;border:1px solid #fecaca}
.pattern{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:9px 12px;font-size:14px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:2px solid var(--brand);color:var(--brand);background:#eef2ff;border-radius:99px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer}
.chip.used{opacity:.25;pointer-events:none}
.built{background:#f5f3ff;border:1.5px dashed #c4b5fd;border-radius:12px;min-height:56px;padding:12px 14px;font-size:16.5px;line-height:1.6;margin:10px 0}
.sent{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;margin:8px 0;cursor:pointer;line-height:1.55}
.sent.picked{border-color:var(--brand);background:#eef2ff}
.sent.right{border-color:var(--ok);background:#ecfdf5}
.sent.wrongb{border-color:var(--bad);background:#fef2f2}
.prog{font-size:13px;color:var(--sub);font-weight:700}
textarea{width:100%;min-height:260px;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:16px;line-height:1.7;font-family:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--brand)}
select{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font-size:15.5px;background:#fff;margin:8px 0}
.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.metric:last-child{border:0}
.metric b{font-weight:800}
.flag{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:14px;margin:7px 0}
.good{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:10px 12px;font-size:14px;margin:7px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.check:last-child{border:0}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:50}
nav .inner{max-width:540px;width:100%;display:flex}
nav button{flex:1;background:none;border:0;padding:10px 0 14px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer}
nav button.on{color:var(--brand)}
nav button span{display:block;font-size:21px;margin-bottom:1px}
.back{background:none;border:0;color:var(--brand);font-weight:800;font-size:15px;cursor:pointer;padding:6px 0}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:#eef2ff;color:var(--brand);margin-bottom:6px}
.tag.rose{background:#fff1f2;color:var(--rose)}.tag.teal{background:#f0fdfa;color:var(--teal)}.tag.amber{background:#fffbeb;color:var(--amber)}
.kpi{display:flex;gap:8px;margin:10px 0}
.kpi div{flex:1;background:#f5f3ff;border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:19px}
.kpi span{font-size:11.5px;color:var(--sub)}
.hidden{display:none}
.timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--brand)}
details{margin:10px 0}summary{cursor:pointer;font-weight:800;color:var(--brand);font-size:14.5px}
.skel{background:#f5f3ff;border-radius:12px;padding:13px 14px;font-size:14.5px;line-height:1.7;margin-top:8px}
.skel b{color:var(--brand)}
footer{text-align:center;color:#9ca3af;font-size:12px;padding:18px 0 4px}
</style>
</head>
<body>
<div id="wrap">
<header>
<div class="logo">BAND JUMP · IELTS WRITING</div>
<h1>4.5에서 <span class="grad">6.0</span>으로,<br>쓰는 법만 바꿉니다</h1>
<p class="sub">단어를 더 외우는 앱이 아니에요. 4.5와 6.0의 차이는 <b>의미가 막히는 오류가 없는가</b>, <b>복문을 안정적으로 쓰는가</b>, <b>문단에 뼈대가 있는가</b> — 딱 이 세 가지에서 갈립니다.</p>
</header>
<main id="app"></main>
<footer>Band Jump v1.0 · 하루 한 레슨, 8주 코스 · 진단 결과는 시작점 안내용이며 실제 시험 점수를 보장하지 않습니다 · 진도는 이 기기에만 저장됩니다</footer>
</div>
<nav><div class="inner">
<button data-nav="home" class="on"><span>🏠</span>홈</button>
<button data-nav="train"><span>🗓️</span>8주 코스</button>
<button data-nav="write"><span>🧩</span>에세이 조립</button>
<button data-nav="my"><span>📊</span>내 기록</button>
</div></nav>
<script>
"use strict";
/* ============ DATA ============ */
const CLINIC=[
{id:"c1",cat:"문장 경계",opts:["Many people use smartphones they are useful in daily life.","Many people use smartphones because they are useful in daily life.","Because they are useful in daily life."],a:1,why:"두 문장을 연결어 없이 붙이면 run-on 오류예요. because로 이유를 이어주면 한 문장 안에서 의미가 완성됩니다.",pat:"주장 + because + 이유"},
{id:"c2",cat:"주어-동사 일치",opts:["The number of students increase every year.","The number of students increases every year.","The number of students are increasing every years."],a:1,why:"진짜 주어는 students가 아니라 number(단수)예요. 그래서 동사도 단수 increases가 옵니다.",pat:"The number of + 복수명사 + 단수동사"},
{id:"c3",cat:"시제",opts:["In the past, people sends letters to communicate.","In the past, people sent letters to communicate.","In the past, people sending letters to communicate."],a:1,why:"'In the past'라는 신호가 있으면 동사는 과거형 sent로 바꿔야 해요.",pat:"In the past, + 주어 + 과거형 동사"},
{id:"c4",cat:"관사·수",opts:["Government should invest in a public transport.","Governments should invest in public transport.","Governments should invest in publics transport."],a:1,why:"일반적으로 말하는 '공공교통'은 셀 수 없는 개념이라 관사 없이 씁니다. 주어 governments는 복수가 자연스러워요.",pat:"Governments should invest in + (관사 없는) 공공 개념"},
{id:"c5",cat:"단어 형태",opts:["The develop of technology is fast.","The development of technology is fast.","The developing of technology is fastly."],a:1,why:"The 뒤, of 앞에는 명사가 와야 해요. develop(동사)의 명사형은 development입니다.",pat:"The + 명사(development) + of + 명사"},
{id:"c6",cat:"문장 경계",opts:["Although it is expensive.","Although it is expensive, many people buy smartphones.","Although it is expensive many people buy smartphones"],a:1,why:"Although로 시작하는 절은 혼자서는 문장이 못 돼요. 콤마 뒤에 주절이 반드시 따라와야 합니다.",pat:"Although + 절, + 주절"},
{id:"c7",cat:"주어-동사 일치",opts:["Every student have to wear a uniform.","Every student has to wear a uniform.","Every students has to wear a uniform."],a:1,why:"Every + 단수명사예요. 주어가 단수라 has를 씁니다.",pat:"Every + 단수명사 + 단수동사"},
{id:"c8",cat:"동사 형태",opts:["This policy will helps reduce crime.","This policy will help reduce crime.","This policy will helped reduce crime."],a:1,why:"will 뒤에는 언제나 동사원형 help가 옵니다. -s도, 과거형도 붙이지 않아요.",pat:"will + 동사원형"},
{id:"c9",cat:"문장 경계",opts:["Online learning is flexible, it saves time.","Online learning is flexible, and it saves time.","Online learning is flexible it saves time very much."],a:1,why:"콤마 하나만으로 두 절을 이을 수는 없어요(comma splice). and 같은 연결사가 필요합니다.",pat:"절, + and/so/but + 절"},
{id:"c10",cat:"관사·수",opts:["Many informations are available online.","Much information is available online.","Many information is available online."],a:1,why:"information은 셀 수 없는 명사예요. many가 아니라 much, 동사도 단수 is를 씁니다.",pat:"Much + 불가산명사 + 단수동사 (information, advice, equipment)"},
{id:"c11",cat:"동사 형태",opts:["By use public transport, we can reduce pollution.","By using public transport, we can reduce pollution.","By used public transport, we can reduce pollution."],a:1,why:"전치사 By 뒤에는 동명사 using이 와요. 수단·방법을 말하는 강력한 패턴입니다.",pat:"By + ~ing, 주어 + can + 결과"},
{id:"c12",cat:"주어-동사 일치",opts:["One of the main reasons are cost.","One of the main reasons is cost.","One of the main reason is cost."],a:1,why:"주어는 reasons가 아니라 One(단수)이에요. 그래서 is를 씁니다.",pat:"One of the + 복수명사 + 단수동사"},
{id:"c13",cat:"시제",opts:["When I was young, I play outside every day.","When I was young, I played outside every day.","When I was young, I am playing outside every day."],a:1,why:"과거 이야기(was)에는 과거형 played로 통일해요. 시제가 섞이면 읽는 사람이 헷갈립니다.",pat:"과거 신호(was, In the past) → 전부 과거형"},
{id:"c14",cat:"관사·수",opts:["The education is important for everyone.","Education is important for everyone.","An education is important for everyone in general way."],a:1,why:"'교육 일반'처럼 개념 전체를 말할 때는 the를 붙이지 않아요. IELTS에서 정말 자주 틀리는 지점입니다.",pat:"일반 개념(education, society, technology) = 관사 없음"},
{id:"c15",cat:"단어 형태",opts:["It is importance to protect the environment.","It is important to protect the environment.","It is importantly to protect the environment."],a:1,why:"be동사 뒤에는 형용사 important가 와요. importance는 명사라 이 자리에 못 들어갑니다.",pat:"It is + 형용사 + to + 동사원형"},
{id:"c16",cat:"문장 경계",opts:["Technology has changed our lives. For example smartphones.","Technology has changed our lives. For example, smartphones have changed how we communicate.","Technology has changed our lives for example smartphones changed it"],a:1,why:"'For example' 뒤에도 완전한 문장(주어+동사)이 와야 해요. smartphones만 두면 조각 문장입니다.",pat:"For example, + 주어 + 동사 + 목적어"},
{id:"c17",cat:"주어",opts:["Is important to exercise regularly.","It is important to exercise regularly.","There is important to exercise regularly."],a:1,why:"영어 문장에는 주어가 꼭 필요해요. 내용이 뒤에 있을 때는 형식주어 It으로 시작합니다.",pat:"It is + 형용사 + to + 동사원형"},
{id:"c18",cat:"비교급",opts:["Cars are more faster than bicycles.","Cars are faster than bicycles.","Cars are most faster than bicycles."],a:1,why:"faster 자체가 비교급이라 more를 또 붙이면 이중 비교급 오류예요.",pat:"짧은 형용사 + -er than (more와 함께 쓰지 않기)"},
{id:"c19",cat:"동사 형태",opts:["This problem should be solve by the government.","This problem should be solved by the government.","This problem should solved by the government."],a:1,why:"be + 과거분사(solved)가 수동태의 모양이에요. '해결되어야 한다'는 수동태로 씁니다.",pat:"should be + 과거분사"},
{id:"c20",cat:"주어-동사 일치",opts:["There is many advantages to living in a city.","There are many advantages to living in a city.","There are much advantages to living in a city."],a:1,why:"There 뒤 명사가 복수(advantages)면 be동사도 are예요. 뒤를 보고 결정합니다.",pat:"There are + 복수명사 / There is + 단수·불가산"},
{id:"c21",cat:"동사 형태",opts:["Students should avoid to waste time.","Students should avoid wasting time.","Students should avoid waste time."],a:1,why:"avoid 뒤에는 ~ing가 옵니다. enjoy, avoid, consider, finish는 전부 같은 팀이에요.",pat:"avoid/enjoy/consider + ~ing"},
{id:"c22",cat:"문장 경계",opts:["He studied hard. Because he wanted to pass.","He studied hard because he wanted to pass the exam.","He studied hard, because he wanted, to pass."],a:1,why:"because 절만 따로 떼어 마침표를 찍으면 조각 문장이 돼요. 앞 문장에 붙여서 한 문장으로 쓰세요.",pat:"주절 + because + 이유 절 (마침표로 끊지 않기)"},
{id:"c23",cat:"관사·수",opts:["There are fewer health problems these days.","There are less health problems these days.","There is fewer health problems these days."],a:0,why:"problems는 셀 수 있는 복수명사예요. '더 적은 수'에는 fewer, 동사는 are를 씁니다.",pat:"fewer + 가산 복수 / less + 불가산"},
{id:"c24",cat:"관사·수",opts:["Only few people can afford this.","Only a few people can afford this.","Only few of people can affords this."],a:1,why:"few 앞의 a 하나가 뜻을 바꿔요. 'a few = 몇몇은 있다', 'few = 거의 없다'입니다.",pat:"a few = 어느 정도 있음 / few = 거의 없음"}
];
const BUILDER_MCQ=[
{id:"b1",link:"because",opts:["Many people work from home because they want to avoid traffic.","Because many people work from home, they want to avoid traffic.","Many people work from home because they want to avoid traffic every day they do."],a:0,why:"because는 '이유' 앞에 붙어요. 이유(they want to avoid traffic)가 뒤에 오도록 순서를 확인하세요.",pat:"주장 + because + 이유"},
{id:"b2",link:"although",opts:["Although electric cars are expensive, many people buy them.","Although electric cars are expensive. Many people buy them.","Electric cars are expensive, although many people buy them expensive."],a:0,why:"Although 절 + 콤마 + 주절. 마침표로 끊으면 조각 문장이 됩니다.",pat:"Although + 불리한 조건, + 그럼에도 주절"},
{id:"b3",link:"which",opts:["The city built a new park, which attracts many visitors.","The city built a new park which it attracts many visitors.","The city built a new park, which attracting many visitors."],a:0,why:"which 절 안에는 주어를 또 넣지 않아요. which가 주어 역할까지 합니다.",pat:"명사, which + 동사 (주어 중복 금지)"},
{id:"b4",link:"if",opts:["If governments invest in schools, children get better jobs.","If governments invest in schools. Children get better jobs.","If governments will invest in schools, children get better jobs."],a:0,why:"조건을 말하는 if 절에서는 will을 쓰지 않고 현재형을 써요. 습관처럼 외워두는 규칙입니다.",pat:"If + 현재형, + 주절"},
{id:"b5",link:"when",opts:["When children watch too much TV, they exercise less.","When children watch too much TV. They exercise less.","When children watches too much TV, they exercise less."],a:0,why:"when 절도 콤마로 주절과 이어야 해요. children은 복수라 watch 그대로입니다.",pat:"When + 절, + 결과"},
{id:"b6",link:"so",opts:["Pollution increased, so the government introduced new laws.","So pollution increased, the government introduced new laws it.","Pollution increased so that the government introduced laws yesterday it did."],a:0,why:"원인 뒤에 so + 결과 순서예요. so 앞 콤마도 잊지 마세요.",pat:"원인, so + 결과"},
{id:"b7",link:"because of",opts:["Flights were cancelled because of the bad weather.","Flights were cancelled because of the weather was bad.","Because of the weather was bad, flights were cancelled."],a:0,why:"because of 뒤에는 완전한 문장이 아니라 명사구(the bad weather)만 와요. 문장을 다 넣고 싶으면 because를 쓰세요.",pat:"because of + 명사구 / because + 문장"},
{id:"b8",link:"who",opts:["People who exercise regularly live longer.","People who exercise regularly they live longer.","People which exercise regularly live longer."],a:0,why:"사람에게는 who, 사물에게는 which예요. 그리고 who 절 뒤에 they를 또 쓰지 않습니다.",pat:"사람 + who + 동사 / 사물 + which + 동사"},
{id:"b9",link:"although",opts:["Although studying abroad is expensive, it offers valuable experience.","Although studying abroad is expensive. It offers valuable experience.","Studying abroad is expensive, although it offers valuable experience it."],a:0,why:"양보(although)로 시작하면 글에 깊이가 생겨요. 구조는 b2와 똑같습니다 — 반복이 실력입니다.",pat:"Although + 단점, + 장점 (논의형 에세이의 핵심 무기)"}
];

{id:"a2",type:"논의형 (Discussion)",q:"Some people think that children should learn to compete, while others believe that cooperation is more valuable. Discuss both views and give your own opinion.",band:"이 에세이의 수준: Band 6.5 — 양쪽 관점을 공정하게 다루고 마지막에 자기 의견을 분명히 밝히는 논의형의 표준 구조예요.",breaks:[2,6,10],parts:["서론","본문 1 — 경쟁을 지지하는 관점","본문 2 — 협력을 지지하는 관점 + 내 의견","결론"],s:[

/* ============ POOLS / STATE ============ */
const byId=(arr)=>Object.fromEntries(arr.map(x=>[x.id,x]));
const MCQ={clinic:byId(CLINIC),builder:byId(BUILDER_MCQ),chunk:byId(CHUNKS),paraphrase:byId(PARAPHRASE),diag:byId(DIAG)};
const ORD={builder:byId(BUILDER_ORDER),para:byId(PARA)};
const KEY="bandjump-v1";
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.lessons=S.lessons||{};S.res=S.res||{};S.review=S.review||{};S.days=S.days||[];S.diag=S.diag||null;S.asm=S.asm||{};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function touchDay(){const t=todayStr();if(!S.days.includes(t)){S.days.push(t);save()}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
const app=document.getElementById("app");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function recordResult(pool,id,correct){
  const k=pool+":"+id;const prev=S.res[k];
  S.res[k]={r:correct?1:0,tries:(prev?prev.tries:0)+1};
  const now=Date.now();
  if(!correct){S.review[k]={due:now+86400000,stage:0}}
  else if(S.review[k]){const r=S.review[k];r.stage=(r.stage||0)+1;if(r.stage>=3){delete S.review[k]}else{r.due=now+(r.stage===1?3:7)*86400000}}
  touchDay();save();
}
function dueReviews(){const now=Date.now();return Object.keys(S.review).filter(k=>S.review[k].due<=now)}
function exFromKey(k){const[pool,id]=k.split(":");if(MCQ[pool]&&MCQ[pool][id])return["mcq",pool,id];if(ORD[pool]&&ORD[pool][id])return pool==="para"?["para",pool,id]:["order",pool,id];return null}
function mastery(pool){const items=pool==="builder"?BUILDER_MCQ.concat(BUILDER_ORDER):(MCQ[pool]?Object.values(MCQ[pool]):Object.values(ORD[pool]||{}));let ok=0;items.forEach(it=>{const r=S.res[pool+":"+it.id];if(r&&r.r===1)ok++});return{ok,total:items.length}}
function allLessons(){const out=[];WEEKS.forEach(w=>w.lessons.forEach(l=>out.push({w:w.w,l})));return out}
function nextLesson(){return allLessons().find(x=>x.l.ready!==false&&!S.lessons[x.l.id])||allLessons().find(x=>x.l.ready!==false)}
function streak(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(todayStr()))d.setDate(d.getDate()-1);while(set.has(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))){n++;d.setDate(d.getDate()-1)}return n}

/* ============ SESSION RUNNER ============ */
let SES=null;
function startSession(title,exercises,onFinish,opts){
  opts=opts||{};SES={title,exercises:exercises.filter(e=>exFromKey(e[1]+":"+e[2])),i:0,correct:0,onFinish,reviewMode:!!opts.reviewMode};
  if(!SES.exercises.length){app.innerHTML='<div class="card"><h2>준비된 문제가 없어요</h2><p class="small">복습할 항목이 아직 없습니다.</p></div><button class="btn" onclick="go(\'home\')">홈으로</button>';return}
  renderExercise();
}
function renderExercise(){
  const[kind,pool,id]=SES.exercises[SES.i];
  const head='<button class="back" onclick="quitSession()">‹ 그만하기</button><div class="prog">'+esc(SES.title)+' · '+(SES.i+1)+' / '+SES.exercises.length+'</div>';
  if(kind==="mcq")renderMCQ(head,pool,MCQ[pool][id]);
  else if(kind==="order")renderOrder(head,ORD[pool][id].tokens,"order",pool,id);
  else if(kind==="para"){const p=ORD.para[id];renderPara(head,p)}
}
function finishExercise(correct){
  const[kind,pool,id]=SES.exercises[SES.i];
  if(!SES.reviewMode)recordResult(pool,id,correct);else recordResult(pool,id,correct);
  if(correct)SES.correct++;
  SES.i++;
  if(SES.i>=SES.exercises.length){const f=SES.onFinish,c=SES.correct,t=SES.exercises.length;SES=null;f&&f(c,t)}
  else renderExercise();
}
function quitSession(){SES=null;go("train")}
function mcqPrompt(pool,item){
  if(pool==="clinic")return{t:"문장 수술실 · "+item.cat,q:"가장 올바른 문장은 어느 것인가요?"};
  if(pool==="builder")return{t:"문장 키우기 · "+item.link,q:"두 문장을 바르게 합친 것은 어느 것인가요?"};
  if(pool==="chunk")return{t:"토픽 청크 · "+item.topic,q:"빈칸에 들어가면 표현이 완성되는 단어는?"};
  if(pool==="paraphrase")return{t:"패러프레이즈",q:"아래 문장을 가장 잘 바꿔 쓴 것은?"};
  if(pool==="diag")return{t:"진단",q:item.q||"가장 올바른 문장은 어느 것인가요?"};
  return{t:"",q:""};
}
function renderMCQ(head,pool,item){
  const p=mcqPrompt(pool,item);
  const order=shuffle(item.opts.map((o,i)=>({o,i})));
  let html=head+'<div class="card"><span class="tag">'+esc(p.t)+'</span><div class="q">'+esc(p.q)+"</div>";
  if(pool==="paraphrase"||pool==="diag"&&item.q) { if(pool==="paraphrase")html+='<div class="qen">'+esc(item.q)+"</div>"; }
  if(pool==="chunk")html+='<div class="qen">'+esc(item.s)+"</div>";
  html+='<div id="opts">';
  order.forEach(({o,i})=>{html+='<button class="opt" data-i="'+i+'">'+esc(o)+"</button>"});
  html+='</div><div id="fb"></div></div>';
  app.innerHTML=html;window.scrollTo(0,0);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const chosen=+b.dataset.i;const correct=chosen===item.a;
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===item.a)x.classList.add("correct")});
    if(!correct)b.classList.add("wrong");
    document.getElementById("fb").innerHTML='<div class="why '+(correct?"ok":"no")+'"><b>'+(correct?"정답이에요.":"아쉬워요. 정답을 확인하세요.")+"</b><br>"+esc(item.why||"")+(item.pat?'<div class="pattern">🔑 '+esc(item.pat)+"</div>":"")+(item.ko?'<div class="pattern">🔑 '+esc(item.ko)+"</div>":"")+'</div><button class="btn" id="nextBtn">'+(SES.i+1>=SES.exercises.length?"결과 보기":"다음 문제")+"</button>";
    document.getElementById("nextBtn").onclick=()=>finishExercise(correct);
  });
}
function renderOrder(head,tokens,kind,pool,id){
  const item=ORD[pool][id];
  let picked=[];
  const draw=()=>{
    const used=new Set(picked);
    let html=head+'<div class="card"><span class="tag teal">재조립</span><div class="q">조각을 순서대로 탭해서 문장을 완성하세요</div><div class="built">'+(picked.length?esc(picked.map(i=>tokens[i]).join(" ")):'<span class="small">여기에 문장이 조립됩니다</span>')+'</div><div class="chips">';
    shuffle(tokens.map((t,i)=>i)).forEach(i=>{if(!used.has(i))html+='<button class="chip" data-i="'+i+'">'+esc(tokens[i])+"</button>"});
    html+='</div><div class="btnrow"><button class="btn ghost" id="undoBtn">되돌리기</button><button class="btn" id="chkBtn" '+(picked.length===tokens.length?"":"disabled")+">확인</button></div>"+'<div id="fb"></div></div>';
    app.innerHTML=html;window.scrollTo(0,0);
    app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{picked.push(+c.dataset.i);draw()});
    const u=document.getElementById("undoBtn");if(u)u.onclick=()=>{picked.pop();draw()};
    const k2=document.getElementById("chkBtn");if(k2)k2.onclick=()=>{
      const correct=picked.every((v,idx)=>v===idx);
      document.getElementById("fb").innerHTML='<div class="why '+(correct?"ok":"no")+'"><b>'+(correct?"완벽해요. 이 문장 모양을 통째로 기억하세요.":"순서가 달라요. 정답 문장을 소리 내어 읽어보세요.")+'</b><br><span class="qen" style="display:block">'+esc(tokens.join(" "))+"</span>"+esc(item.why||"")+(item.pat?'<div class="pattern">🔑 '+esc(item.pat)+"</div>":"")+'</div><button class="btn" id="nextBtn">'+(SES.i+1>=SES.exercises.length?"결과 보기":"다음 문제")+"</button>";
      document.getElementById("nextBtn").onclick=()=>finishExercise(correct);
    };
  };draw();
}
function renderPara(head,p){
  let picked=[];
  const draw=()=>{
    let html=head+'<div class="card"><span class="tag amber">문단 조립 · '+esc(p.topic)+'</span><div class="q">문장을 탭한 순서대로 문단이 만들어집니다. 주제문부터 순서대로 골라보세요</div>';
    p.s.forEach((s,i)=>{const idx=picked.indexOf(i);html+='<button class="sent'+(idx>=0?" picked":"")+'" data-i="'+i+'">'+(idx>=0?("<b>"+(idx+1)+".</b> "):"")+esc(s)+"</button>"});
    html+='<div class="btnrow"><button class="btn ghost" id="rstBtn">처음부터</button><button class="btn" id="chkBtn" '+(picked.length===p.s.length?"":"disabled")+">확인</button></div>"+'<div id="fb"></div></div>';
    app.innerHTML=html;window.scrollTo(0,0);
    app.querySelectorAll(".sent").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const at=picked.indexOf(i);if(at>=0)picked.splice(at,1);else picked.push(i);draw()});
    document.getElementById("rstBtn").onclick=()=>{picked=[];draw()};
    document.getElementById("chkBtn").onclick=()=>{
      const correct=picked.every((v,idx)=>v===idx);
      app.querySelectorAll(".sent").forEach(b=>{const i=+b.dataset.i;b.classList.add(picked.indexOf(i)===i?"right":"wrongb")});
      document.getElementById("fb").innerHTML='<div class="why '+(correct?"ok":"no")+'"><b>'+(correct?"문단의 뼈대가 그대로 보여요.":"아쉬워요. 아래 순서가 정답 뼈대입니다.")+"</b><br>"+esc(p.note)+'</div><button class="btn" id="nextBtn">'+(SES.i+1>=SES.exercises.length?"결과 보기":"다음 문제")+"</button>";
      document.getElementById("nextBtn").onclick=()=>finishExercise(correct);
    };
  };draw();
}
function sessionResult(title,correct,total,backView,extra){
  const pct=total?Math.round(correct/total*100):0;
  app.innerHTML='<div class="card" style="text-align:center"><div style="font-size:44px">'+(pct>=80?"🎉":pct>=50?"💪":"🌱")+'</div><h2>'+esc(title)+'</h2><p style="font-size:30px;font-weight:900;color:var(--brand)">'+correct+" / "+total+'</p><p class="small">'+(pct>=80?"훌륭해요. 이 감각이 6.0의 감각입니다.":pct>=50?"좋아요. 틀린 문제는 내일 복습으로 다시 만나요.":"괜찮아요. 틀린 문제는 복습 큐에 들어갔고, 반복해서 만나면 몸이 기억합니다.")+"</p>"+(extra||"")+'</div><button class="btn" onclick="go(\''+backView+'\')">계속하기</button>';
  window.scrollTo(0,0);
}

function startFree(pool){
  let ex=[];
  if(pool==="builder"){ex=BUILDER_MCQ.map(x=>["mcq","builder",x.id]).concat(BUILDER_ORDER.map(x=>["order","builder",x.id]))}
  else if(pool==="para"){ex=PARA.map(x=>["para","para",x.id])}
  else{ex=Object.values(MCQ[pool]).map(x=>["mcq",pool,x.id])}
  ex=shuffle(ex);
  const wrongFirst=ex.sort((a,b)=>{const ra=S.res[a[1]+":"+a[2]],rb=S.res[b[1]+":"+b[2]];return((ra&&ra.r===1)?1:0)-((rb&&rb.r===1)?1:0)});
  startSession("자유 훈련",wrongFirst.slice(0,8),(c,t)=>sessionResult("훈련 완료",c,t,"train"));
}
function startReview(){
  const keys=dueReviews();const ex=keys.map(exFromKey).filter(Boolean);
  startSession("간격 반복 복습",shuffle(ex).slice(0,10),(c,t)=>sessionResult("복습 완료",c,t,"home"),{reviewMode:true});
}
function startDiag(){
  const ex=DIAG.map(d=>["mcq","diag",d.id]);
  startSession("시작 진단",ex,(c,t)=>{
    const scores={};DIAG.forEach(d=>{const r=S.res["diag:"+d.id];scores[d.crit]=scores[d.crit]||{ok:0,n:0};scores[d.crit].n++;if(r&&r.r===1)scores[d.crit].ok++});
    S.diag={at:Date.now(),scores};save();
    const names={TR:"과제 응답 (질문이 시키는 대로 쓰기)",CC:"구성·연결 (문단 뼈대와 흐름)",LR:"어휘 (짝꿍 표현과 정확한 단어)",GRA:"문법 (문장 정확도와 복문)"};
    let rows="";let weakest=null,wv=2;
    Object.keys(names).forEach(k=>{const s=scores[k]||{ok:0,n:1};const p=Math.round(s.ok/s.n*100);if(p<wv){wv=p;weakest=k}rows+='<div class="metric"><span>'+names[k]+'</span><b>'+p+"%</b></div>"});
    const advice={GRA:"문장 정확도부터 잡아야 합니다. 1주차부터 순서대로 시작하세요.",CC:"문장보다 문단의 흐름이 약점이에요. 그래도 1~3주차 문장 훈련 뒤 4주차에서 크게 오릅니다.",LR:"표현의 짝꿍(콜로케이션)이 약점이에요. 6주차 청크 훈련이 특히 도움이 됩니다.",TR:"질문을 정확히 읽는 게 약점이에요. 5주차(서론)와 7주차(유형별)가 핵심입니다."};
    app.innerHTML='<div class="card"><h2>진단 결과</h2>'+rows+'<div class="why ok" style="margin-top:12px"><b>가장 먼저 잡을 곳: '+names[weakest]+'</b><br>'+advice[weakest]+'<br><br>그래도 코스는 1주차부터 순서대로 가세요. 이 앱의 레슨은 앞 레슨이 뒷 레슨의 재료가 되도록 쌓여 있습니다.</div></div><button class="btn" onclick="startLesson(\'w1d1\')">1주차 첫 레슨 시작하기</button>';
    window.scrollTo(0,0);
  });
}

      S.asm[id]={done:true,perfect:correct,at:Date.now()};save();
      let full="";let partIdx=0;
      a.s.forEach((s,i)=>{if(i===0||a.breaks.includes(i)){full+='<p style="margin:12px 0 4px"><span class="tag">'+esc(a.parts[partIdx++])+"</span></p>"}full+="<p style='margin:2px 0'>"+esc(s)+"</p>"});
      document.getElementById("fb").innerHTML='<div class="why '+(correct?"ok":"no")+'"><b>'+(correct?"완벽합니다. 에세이 한 편의 뼈대를 통째로 조립했어요.":"조립 완료. 아래 완성본과 순서를 비교해 보세요.")+"</b><br>"+esc(a.band)+'</div><div class="card" style="margin:10px 0 0">'+full+"</div>";
      document.getElementById("chkBtn").disabled=true;
    };
  };draw();
}
function renderMy(){
  const names=[["clinic","문장 수술실"],["builder","문장 키우기"],["para","문단 조립"],["paraphrase","패러프레이즈"],["chunk","토픽 청크"]];
  let html='<div class="card"><h2>내 기록</h2><div class="kpi"><div><b>'+streak()+'일</b><span>연속</span></div><div><b>'+S.days.length+'일</b><span>누적 학습일</span></div><div><b>'+Object.keys(S.lessons).length+'개</b><span>완료 레슨</span></div></div>';
  names.forEach(([p,n])=>{const m=mastery(p);const pct=m.total?Math.round(m.ok/m.total*100):0;html+="<div style='margin:10px 0'><div style='display:flex;justify-content:space-between;font-size:14px'><span>"+n+"</span><b>"+m.ok+" / "+m.total+"</b></div><div class='bar'><i style='width:"+pct+"%'></i></div></div>"});
  html+="</div>";
  const rev=Object.keys(S.review);
  html+='<div class="card"><h2>복습 큐</h2>'+(rev.length?'<p class="small">아직 몸에 붙지 않은 문제 '+rev.length+'개가 간격 반복으로 돌고 있어요. 오늘 도래: '+dueReviews().length+'개</p><br><button class="btn teal" onclick="startReview()">지금 복습하기</button>':'<p class="small">복습 큐가 비어 있어요. 문제를 틀리면 자동으로 여기에 들어갑니다.</p>')+"</div>";
  if(S.diag){html+='<div class="card"><h2>진단 기록</h2><p class="small">'+new Date(S.diag.at).toLocaleDateString("ko-KR")+' 진단 완료</p><br><button class="btn ghost" onclick="startDiag()">다시 진단하기</button></div>'}
  html+='<div class="card"><h2>처음부터 다시 시작</h2><p class="small">모든 진도와 기록을 지웁니다.</p><br><button class="btn ghost" style="border-color:var(--bad);color:var(--bad)" onclick="if(confirm(\'정말 모든 기록을 지울까요?\')){localStorage.removeItem(KEY);location.reload()}">기록 초기화</button></div>';
  app.innerHTML=html;
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
go("home");
</script>
