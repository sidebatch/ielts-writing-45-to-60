<style>
:root{--ink:#1e1b2e;--sub:#6b7280;--bg:#f6f6fb;--card:#fff;--brand:#4338ca;--brand2:#7c3aed;--teal:#0f766e;--amber:#b45309;--rose:#be123c;--line:#e7e5f0;--ok:#059669;--bad:#dc2626;--radius:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}

header{padding:22px 4px 8px}

h1 .grad{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0;box-shadow:0 2px 10px rgba(67,56,202,.05)}
.card h2{font-size:17px;font-weight:800;margin-bottom:6px}
.card h3{font-size:15px;font-weight:800;margin-bottom:4px}
.small{font-size:13px;color:var(--sub)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;min-height:52px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;text-align:center}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.btn.teal{background:var(--teal)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px}.btnrow .btn{flex:1}
.journey{background:linear-gradient(135deg,#312e81,#6d28d9);color:#fff;border:0}
.journey .track{height:10px;background:rgba(255,255,255,.25);border-radius:99px;margin:14px 0 6px;overflow:hidden}
.journey .fill{height:100%;background:#fbbf24;border-radius:99px;transition:width .5s}
.journey .marks{display:flex;justify-content:space-between;font-size:12.5px;opacity:.9}
.mod{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.mod:last-child{border-bottom:0}
.mod .ic{font-size:26px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:#eef2ff;border-radius:14px;flex:none}
.mod .grow{flex:1;min-width:0}
.mod .t{font-weight:800;font-size:15px}
.mod .d{font-size:13px;color:var(--sub)}
.mod .pct{font-weight:900;color:var(--brand);font-size:15px}
.bar{height:7px;background:#eceaf6;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 15px;min-height:48px;font-size:15.5px;margin:9px 0;cursor:pointer;line-height:1.5}
.opt:hover{border-color:#c7c2ea}
.opt.correct{border-color:var(--ok);background:#ecfdf5}
.opt.wrong{border-color:var(--bad);background:#fef2f2}
.opt:disabled{cursor:default;opacity:.92}
.q{font-size:17px;font-weight:700;line-height:1.6;margin:8px 0 4px}
.qen{font-size:16.5px;line-height:1.65;background:#f5f3ff;border:1px solid #e9e5ff;border-radius:12px;padding:13px 14px;margin:10px 0}
.why{border-radius:12px;padding:13px 14px;margin:12px 0;font-size:14.5px;line-height:1.6}
.why.ok{background:#ecfdf5;border:1px solid #a7f3d0}
.why.no{background:#fef2f2;border:1px solid #fecaca}
.pattern{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:9px 12px;font-size:14px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{display:inline-flex;align-items:center;min-height:44px;border:2px solid var(--brand);color:var(--brand);background:#eef2ff;border-radius:99px;padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer}
.chip.used{opacity:.25;pointer-events:none}
.built{background:#f5f3ff;border:1.5px dashed #c4b5fd;border-radius:12px;min-height:64px;padding:12px 14px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;align-content:center}
.chip.used{opacity:.18;pointer-events:none}
.pchip{display:inline-flex;align-items:center;min-height:44px;border:2px solid var(--brand);background:#fff;color:var(--ink);border-radius:99px;padding:9px 14px;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #c7d2fe;animation:pop .16s ease}
@keyframes pop{from{transform:scale(.8);opacity:.3}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pchip{animation:none}}
.sent{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;font-size:15.5px;margin:8px 0;cursor:pointer;line-height:1.55}
.sent.picked{border-color:var(--brand);background:#eef2ff}
.sent.right{border-color:var(--ok);background:#ecfdf5}
.sent.wrongb{border-color:var(--bad);background:#fef2f2}
.fchunk{display:inline-block;border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;margin:3px 2px;font-size:16.5px;cursor:pointer;line-height:1.4}
.fchunk:hover{border-color:#c7c2ea}
.fchunk.hit{border-color:var(--amber);background:#fffbeb}
.fchunk.bad{border-color:var(--bad);background:#fef2f2;opacity:.65}
.fchunk.fixed{border-color:var(--ok);background:#ecfdf5;font-weight:700}
.fillin{display:inline-block;width:170px;max-width:60vw;border:0;border-bottom:3px solid var(--brand);background:#eef2ff;border-radius:8px 8px 0 0;padding:6px 10px;font-size:16.5px;font-family:inherit;text-align:center;color:var(--ink)}
.fillin:focus{outline:none;background:#e0e7ff}
.cmp{border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15.5px;line-height:1.6}
.cmp.mine{background:#fffbeb;border:1px solid #fde68a}
.cmp.orig{background:#eef2ff;border:1px solid #c7d2fe}
.cmp b.lab{display:block;font-size:12.5px;letter-spacing:.06em;margin-bottom:3px}
.prog{font-size:13px;color:var(--sub);font-weight:700}
textarea{width:100%;min-height:260px;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:16px;line-height:1.7;font-family:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--brand)}
select{width:100%;padding:13px;min-height:48px;border:2px solid var(--line);border-radius:12px;font-size:16px;background:#fff;margin:8px 0}
.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.metric:last-child{border:0}
.metric b{font-weight:800}
.flag{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:14px;margin:7px 0}
.good{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:10px 12px;font-size:14px;margin:7px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.check:last-child{border:0}
.check input{width:24px;height:24px;margin-top:1px;flex:none;accent-color:var(--brand)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:50}
nav .inner{max-width:540px;width:100%;display:flex}
nav button{flex:1;background:none;border:0;padding:10px 0 14px;min-height:56px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer}
nav button.on{color:var(--brand)}
nav button span{display:block;font-size:21px;margin-bottom:1px}
.back{display:inline-flex;align-items:center;min-height:44px;background:none;border:0;color:var(--brand);font-weight:800;font-size:15px;cursor:pointer;padding:10px 12px 10px 0}
.tag{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:#eef2ff;color:var(--brand);margin-bottom:6px}
.tag.rose{background:#fff1f2;color:var(--rose)}.tag.teal{background:#f0fdfa;color:var(--teal)}.tag.amber{background:#fffbeb;color:var(--amber)}
.kpi{display:flex;gap:8px;margin:10px 0}
.kpi div{flex:1;background:#f5f3ff;border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:19px}
.kpi span{font-size:12.5px;color:var(--sub)}
.hidden{display:none}
.timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--brand)}
details{margin:10px 0}summary{cursor:pointer;font-weight:800;color:var(--brand);font-size:14.5px;padding:12px 0;min-height:44px}
.skel{background:#f5f3ff;border-radius:12px;padding:13px 14px;font-size:14.5px;line-height:1.7;margin-top:8px}
.skel b{color:var(--brand)}
footer{text-align:center;color:#595959;font-size:12.5px;padding:18px 0 4px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.btn:active{transform:none}}
</style>

<script>
"use strict";
/* ============ DATA ============ */
const CLINIC=[
{id:"c1",cat:"문장 경계",opts:["Many people use smartphones they are useful in daily life.","Many people use smartphones because they are useful in daily life.","Because they are useful in daily life."],a:1,why:"두 문장을 연결어 없이 붙이면 run-on 오류예요. because로 이유를 이어주면 한 문장 안에서 의미가 완성됩니다.",pat:"주장 + because + 이유"},
{id:"c2",cat:"주어-동사 일치",opts:["The number of students increase every year.","The number of students increases every year.","The number of students are increasing every years."],a:1,why:"진짜 주어는 students가 아니라 number(단수)예요. 그래서 동사도 단수 increases가 옵니다.",pat:"The number of + 복수명사 + 단수동사"},
{id:"c3",cat:"시제",opts:["In the past, people sends letters to communicate.","In the past, people sent letters to communicate.","In the past, people sending letters to communicate."],a:1,why:"'In the past'라는 신호가 있으면 동사는 과거형 sent로 바꿔야 해요.",pat:"In the past, + 주어 + 과거형 동사"},
{id:"c4",cat:"관사·수",opts:["Government should invest in a public transport.","Governments should invest in public transport.","Governments should invest in publics transport."],a:1,why:"일반적으로 말하는 '공공교통'은 셀 수 없는 개념이라 관사 없이 씁니다. 주어 governments는 복수가 자연스러워요.",pat:"Governments should invest in + (관사 없는) 공공 개념"},
{id:"c5",cat:"단어 형태",opts:["The develop of technology is fast.","The development of technology is fast.","The developing of technology is fastly."],a:1,why:"The 뒤, of 앞에는 명사가 와야 해요. develop(동사)의 명사형은 development입니다.",pat:"The + 명사(development) + of + 명사"},
{id:"c6",cat:"문장 경계",opts:["Although it is expensive.","Although it is expensive, many people buy smartphones.","Although it is expensive many people buy smartphones."],a:1,why:"Although로 시작하는 절은 혼자서는 문장이 못 돼요. 콤마 뒤에 주절이 반드시 따라와야 합니다.",pat:"Although + 절, + 주절"},
{id:"c7",cat:"주어-동사 일치",opts:["Every student have to wear a uniform.","Every student has to wear a uniform.","Every students has to wear a uniform."],a:1,why:"Every + 단수명사예요. 주어가 단수라 has를 씁니다.",pat:"Every + 단수명사 + 단수동사"},
{id:"c8",cat:"동사 형태",opts:["This policy will helps reduce crime.","This policy will help reduce crime.","This policy will helped reduce crime."],a:1,why:"will 뒤에는 언제나 동사원형 help가 옵니다. -s도, 과거형도 붙이지 않아요.",pat:"will + 동사원형"},
{id:"c9",cat:"문장 경계",opts:["Online learning is flexible, it saves time.","Online learning is flexible, and it saves time.","Online learning is flexible it saves time very much."],a:1,why:"콤마 하나만으로 두 절을 이을 수는 없어요(comma splice). and 같은 연결사가 필요합니다.",pat:"절, + and/so/but + 절"},
{id:"c10",cat:"관사·수",opts:["Many informations are available online.","Much information is available online.","Many information is available online."],a:1,why:"information은 셀 수 없는 명사예요. many가 아니라 much, 동사도 단수 is를 씁니다.",pat:"Much + 불가산명사 + 단수동사 (information, advice, equipment)"},
{id:"c11",cat:"동사 형태",opts:["By use public transport, we can reduce pollution.","By using public transport, we can reduce pollution.","By used public transport, we can reduce pollution."],a:1,why:"전치사 By 뒤에는 동명사 using이 와요. 수단·방법을 말하는 강력한 패턴입니다.",pat:"By + ~ing, 주어 + can + 결과"},
{id:"c12",cat:"주어-동사 일치",opts:["One of the main reasons are cost.","One of the main reasons is cost.","One of the main reason is cost."],a:1,why:"주어는 reasons가 아니라 One(단수)이에요. 그래서 is를 씁니다.",pat:"One of the + 복수명사 + 단수동사"},
{id:"c13",cat:"시제",opts:["When I was young, I play outside every day.","When I was young, I played outside every day.","When I was young, I am playing outside every day."],a:1,why:"과거 이야기(was)에는 과거형 played로 통일해요. 시제가 섞이면 읽는 사람이 헷갈립니다.",pat:"과거 신호(was, In the past) → 전부 과거형"},
{id:"c14",cat:"관사·수",opts:["The education is important for everyone.","Education is important for everyone.","An education is important for everyone in general way."],a:1,why:"'교육 일반'처럼 개념 전체를 말할 때는 the를 붙이지 않아요. IELTS에서 정말 자주 틀리는 지점입니다.",pat:"일반 개념(education, society, technology) = 관사 없음"},
{id:"c15",cat:"단어 형태",opts:["It is importance to protect the environment.","It is important to protect the environment.","It is importantly to protect the environment."],a:1,why:"be동사 뒤에는 형용사 important가 와요. importance는 명사라 이 자리에 못 들어갑니다.",pat:"It is + 형용사 + to + 동사원형"},
{id:"c16",cat:"문장 경계",opts:["Technology has changed our lives. For example smartphones.","Technology has changed our lives. For example, smartphones have changed how we communicate.","Technology has changed our lives for example smartphones changed it."],a:1,why:"'For example' 뒤에도 완전한 문장(주어+동사)이 와야 해요. smartphones만 두면 조각 문장입니다.",pat:"For example, + 주어 + 동사 + 목적어"},
{id:"c17",cat:"주어",opts:["Is important to exercise regularly.","It is important to exercise regularly.","There is important to exercise regularly."],a:1,why:"영어 문장에는 주어가 꼭 필요해요. 내용이 뒤에 있을 때는 형식주어 It으로 시작합니다.",pat:"It is + 형용사 + to + 동사원형"},
{id:"c18",cat:"비교급",opts:["Cars are more faster than bicycles.","Cars are faster than bicycles.","Cars are most faster than bicycles."],a:1,why:"faster 자체가 비교급이라 more를 또 붙이면 이중 비교급 오류예요.",pat:"짧은 형용사 + -er than (more와 함께 쓰지 않기)"},
{id:"c19",cat:"동사 형태",opts:["This problem should be solve by the government.","This problem should be solved by the government.","This problem should solved by the government."],a:1,why:"be + 과거분사(solved)가 수동태의 모양이에요. '해결되어야 한다'는 수동태로 씁니다.",pat:"should be + 과거분사"},
{id:"c20",cat:"주어-동사 일치",opts:["There is many advantages to living in a city.","There are many advantages to living in a city.","There are much advantages to living in a city."],a:1,why:"There 뒤 명사가 복수(advantages)면 be동사도 are예요. 뒤를 보고 결정합니다.",pat:"There are + 복수명사 / There is + 단수·불가산"},
{id:"c21",cat:"동사 형태",opts:["Students should avoid to waste time.","Students should avoid wasting time.","Students should avoid waste time."],a:1,why:"avoid 뒤에는 ~ing가 옵니다. enjoy, avoid, consider, finish는 전부 같은 팀이에요.",pat:"avoid/enjoy/consider + ~ing"},
{id:"c22",cat:"문장 경계",opts:["He studied hard. Because he wanted to pass.","He studied hard because he wanted to pass the exam.","He studied hard, because he wanted, to pass."],a:1,why:"because 절만 따로 떼어 마침표를 찍으면 조각 문장이 돼요. 앞 문장에 붙여서 한 문장으로 쓰세요.",pat:"주절 + because + 이유 절 (마침표로 끊지 않기)"},
{id:"c23",cat:"관사·수",opts:["There are fewer health problems these days.","There are less health problems these days.","There is fewer health problems these days."],a:0,why:"problems는 셀 수 있는 복수명사예요. '더 적은 수'에는 fewer, 동사는 are를 씁니다.",pat:"fewer + 가산 복수 / less + 불가산"},
{id:"c24",cat:"관사·수",opts:["Only few people can afford this.","Only a few people can afford this.","Only few of people can affords this."],a:1,why:"few 앞의 a 하나가 뜻을 바꿔요. 'a few = 몇몇은 있다', 'few = 거의 없다'입니다.",pat:"a few = 어느 정도 있음 / few = 거의 없음"}
];
const BUILDER_MCQ=[
{id:"b1",link:"because",opts:["Many people work from home because they want to avoid traffic.","Because many people work from home, they want to avoid traffic.","Many people work from home because they want to avoid traffic every day they do."],a:0,why:"because는 '이유' 앞에 붙어요. 이유(they want to avoid traffic)가 뒤에 오도록 순서를 확인하세요.",pat:"주장 + because + 이유"},
{id:"b2",link:"although",opts:["Although electric cars are expensive, many people buy them.","Although electric cars are expensive. Many people buy them.","Electric cars are expensive, although many people buy them expensive."],a:0,why:"Although 절 + 콤마 + 주절. 마침표로 끊으면 조각 문장이 됩니다.",pat:"Although + 불리한 조건, + 그럼에도 주절"},
{id:"b3",link:"which",opts:["The city built a new park, which attracts many visitors.","The city built a new park which it attracts many visitors.","The city built a new park, which attracting many visitors."],a:0,why:"which 절 안에는 주어를 또 넣지 않아요. which가 주어 역할까지 합니다.",pat:"명사, which + 동사 (주어 중복 금지)"},
{id:"b4",link:"if",opts:["If governments invest in schools, children get better jobs.","If governments invest in schools. Children get better jobs.","If governments will invest in schools, children get better jobs."],a:0,why:"조건을 말하는 if 절에서는 will을 쓰지 않고 현재형을 써요. 습관처럼 외워두는 규칙입니다.",pat:"If + 현재형, + 주절"},
{id:"b5",link:"when",opts:["When children watch too much TV, they exercise less.","When children watch too much TV. They exercise less.","When children watches too much TV, they exercise less."],a:0,why:"when 절도 콤마로 주절과 이어야 해요. children은 복수라 watch 그대로입니다.",pat:"When + 절, + 결과"},
{id:"b6",link:"so",opts:["Pollution increased, so the government introduced new laws.","So pollution increased, the government introduced new laws it.","Pollution increased so that the government introduced laws yesterday it did."],a:0,why:"원인 뒤에 so + 결과 순서예요. so 앞 콤마도 잊지 마세요.",pat:"원인, so + 결과"},
{id:"b7",link:"because of",opts:["Flights were cancelled because of the bad weather.","Flights were cancelled because of the weather was bad.","Because of the weather was bad, flights were cancelled."],a:0,why:"because of 뒤에는 완전한 문장이 아니라 명사구(the bad weather)만 와요. 문장을 다 넣고 싶으면 because를 쓰세요.",pat:"because of + 명사구 / because + 문장"},
{id:"b8",link:"who",opts:["People who exercise regularly live longer.","People who exercise regularly they live longer.","People which exercise regularly live longer."],a:0,why:"사람에게는 who, 사물에게는 which예요. 그리고 who 절 뒤에 they를 또 쓰지 않습니다.",pat:"사람 + who + 동사 / 사물 + which + 동사"},
{id:"b9",link:"although",opts:["Although studying abroad is expensive, it offers valuable experience.","Although studying abroad is expensive. It offers valuable experience.","Studying abroad is expensive, although it offers valuable experience it."],a:0,why:"양보(although)로 시작하면 글에 깊이가 생겨요. 구조는 b2와 똑같습니다 — 반복이 실력입니다.",pat:"Although + 단점, + 장점 (논의형 에세이의 핵심 무기)"},
{id:"b19",link:"if",opts:["If public transport is affordable, more people will use it.","If public transport will be affordable, more people will use it.","If public transport is affordable. More people will use it."],a:0,why:"if 절에서는 will을 쓰지 않아요. 조건 쪽은 현재형 is, will은 결과 쪽에만 씁니다. 마침표로 끊으면 조각 문장이 돼요.",pat:"If + 현재형, + will + 결과"},
{id:"b20",link:"when",opts:["When students receive feedback, they can improve their writing.","When students receive feedback. They can improve their writing.","When students receives feedback, they can improve their writing."],a:0,why:"When 절도 콤마로 주절과 이어야 해요. students는 복수라 동사는 receive 그대로입니다.",pat:"When + 상황, + can + 결과"},
{id:"b21",link:"who",opts:["Teachers who give clear feedback help students improve.","Teachers who give clear feedback they help students improve.","Teachers which give clear feedback help students improve."],a:0,why:"사람을 설명할 때는 who예요. who 덩어리가 설명을 이어주기 때문에 뒤에 they를 또 쓰지 않습니다.",pat:"사람 + who + 동사 (they 중복 금지)"},
{id:"b22",link:"which",opts:["The course, which lasts eight weeks, helps students write better essays.","The course, which it lasts eight weeks, helps students write better essays.","The course which lasts eight weeks, helps students write essays better it."],a:0,why:"which가 The course를 설명하면서 주어 역할까지 해요. 그래서 뒤에 it을 또 넣지 않습니다. 설명 덩어리는 콤마 사이에 끼워 넣는 모양입니다.",pat:"명사, which + 동사, + 주절 동사"},
{id:"b33",link:"의견형",q:"질문: 'Some people believe that university education should be free for all students. To what extent do you agree or disagree?' — 입장문으로 가장 완전한 것은?",opts:["I completely agree with this view because free university education gives everyone a fair chance to succeed.","This essay will discuss whether university education should be free for all students.","University education is an important topic for many people today."],a:0,why:"의견형 입장문은 두 가지를 갖춰야 해요: 분명한 입장(completely agree)과 본문을 예고하는 이유(because ~ fair chance). 2번은 입장 없이 논의 예고만, 3번은 막연한 감상뿐이라 입장문이 아닙니다.",pat:"입장문 = 분명한 입장 + because + 이유 예고"},
{id:"b34",link:"논의형",q:"질문: 'Some people think that children should learn to compete, while others believe that cooperation is more valuable. Discuss both views and give your own opinion.' — 입장문으로 가장 완전한 것은?",opts:["While competition can motivate children, I believe cooperation is more valuable because it teaches them to work effectively with others.","I believe children should only learn to compete, because competition prepares them for adult life.","Competition and cooperation are both common activities in schools today."],a:0,why:"논의형은 양쪽 관점 + 내 의견, 세 가지가 입장문 안에 다 있어야 해요. 2번은 한쪽만 다루고, 3번은 관점도 의견도 없이 사실만 말합니다.",pat:"논의형 입장문 = While 한쪽 + 반대쪽 + I believe 내 의견"},
{id:"b35",link:"이중질문형",q:"질문: 'Traffic congestion is a serious problem. What are the causes and what solutions can you suggest?' — 입장문(로드맵)으로 가장 완전한 것은?",opts:["This essay will examine the main causes of traffic congestion and suggest several measures that can reduce it.","In my opinion, traffic congestion is getting worse in many large cities.","This essay will discuss the advantages and disadvantages of driving in cities."],a:0,why:"이중질문형은 질문 두 개(원인/해결)를 입장문이 그대로 예고해야 해요. 2번은 두 질문 어느 쪽도 예고하지 않고, 3번은 아예 다른 유형(장단점형)의 구조입니다.",pat:"이중질문형 입장문 = 질문 1 예고 + 질문 2 예고"},
{id:"b36",link:"서론",q:"질문: 'Governments should spend more money on public services rather than the arts.' — 서론으로 가장 완전한 것은?",opts:["It is argued that governments ought to fund public services instead of spending on the arts. I completely agree because public services, such as hospitals and schools, benefit everyone in society.","Governments should spend more money on public services rather than the arts, and this is an important issue today.","It is argued that governments ought to fund public services instead of spending on the arts."],a:0,why:"서론은 패러프레이즈 1문장 + 입장문 1문장이에요. 2번은 질문을 그대로 베꼈고 입장도 없습니다. 3번은 패러프레이즈만 있고 내 입장이 빠져 있어 서론이 완성되지 않았어요.",pat:"서론 = 패러프레이즈 + 입장문 (딱 2문장)"},
{id:"b37",link:"의견형 구조",q:"의견형 질문('...To what extent do you agree or disagree?')의 에세이 계획으로 옳은 것은?",opts:["서론에서 입장을 밝히고, 본문 1과 본문 2에서 그 입장을 뒷받침하는 이유를 각각 펼친 뒤, 결론에서 입장을 다시 말한다.","본문 1에서 찬성 이유를, 본문 2에서 반대 이유를 공평하게 펼치고, 결론에서 가서야 내 입장을 정한다.","서론에서는 입장을 밝히지 않고, 본문에서 읽는 사람이 내 입장을 추측하게 둔다."],a:0,why:"의견형은 처음부터 끝까지 한 방향입니다. 서론의 입장과 본문의 이유, 결론이 전부 같은 쪽을 향해야 해요. 두 번째처럼 양쪽을 공평하게 펼치는 건 논의형의 구조라, 의견형에서는 입장이 흐려집니다.",pat:"의견형 = 입장 → 이유 1 → 이유 2 → 입장 반복"},
{id:"b38",link:"논의형 구조",q:"논의형 질문('Discuss both views and give your own opinion.')의 에세이 계획으로 옳은 것은?",opts:["본문 1에서 한쪽 관점을, 본문 2에서 다른쪽 관점을 각각 공정하게 다룬 뒤, 내 의견을 분명히 밝힌다.","본문 1과 본문 2에서 내 의견만 반복하고, 상대 관점은 언급하지 않는다.","내 의견은 쓰지 않고, 두 관점을 소개하는 것만으로 에세이를 끝낸다."],a:0,why:"논의형의 채점 포인트는 세 가지 — 관점 A, 관점 B, 그리고 내 의견입니다. 하나라도 빠지면 질문에 다 답하지 않은 셈이 돼요. 두 관점을 먼저 공정하게 다뤄야 내 의견에도 무게가 실립니다.",pat:"논의형 = 관점 A 문단 → 관점 B 문단 → 내 의견"},
{id:"b39",link:"장단점형 구조",q:"장단점형 질문('Discuss the advantages and disadvantages.')의 에세이 계획으로 옳은 것은?",opts:["본문 1에서 장점을, 본문 2에서 단점을 다루고, 결론에서 전체의 균형을 정리한다.","본문 1에서 내 의견을 자세히 쓰고, 본문 2에서는 내 경험담을 쓴다.","장점만 자세히 쓰고, 단점은 마지막에 한 문장으로만 언급한다."],a:0,why:"장단점형은 두 방향을 비슷한 무게로 다루는 게 핵심이에요. 한쪽만 길게 쓰면 균형이 깨져서 질문에 절반만 답한 글이 됩니다. 내 개인 의견보다 장점과 단점의 정리가 먼저입니다.",pat:"장단점형 = 장점 문단 → 단점 문단 → 균형 잡힌 결론"},
{id:"b40",link:"문제해결형 구조",q:"문제·해결형 질문('What are the causes of this problem, and what measures can be taken to solve it?')의 에세이 계획으로 옳은 것은?",opts:["본문 1에서 원인을 설명하고, 본문 2에서 그 원인과 짝이 맞는 해결책을 제시한다.","본문 1에서 장점을, 본문 2에서 단점을 쓴다.","원인은 건너뛰고, 해결책만 세 가지 나열한다."],a:0,why:"해결책은 원인과 짝을 이뤄야 설득력이 생겨요. 원인이 '대중교통이 불편해서'라면 해결책은 '대중교통 개선'이어야 합니다. 장단점을 쓰는 건 다른 유형의 구조예요.",pat:"문제해결형 = 원인 문단 → 해결책 문단 (원인-해결 짝 맞추기)"},
{id:"b41",link:"이중질문형 구조",q:"이중질문형('Why is this happening? Is this a positive or negative development?')의 에세이 계획으로 옳은 것은?",opts:["본문 1에서 첫 번째 질문(원인)에 답하고, 본문 2에서 두 번째 질문(긍정적인지 부정적인지)에 답한다.","두 질문을 합쳐 본문 1에서 한꺼번에 답하고, 본문 2에서는 예시만 쓴다.","두 번째 질문은 어려우니, 첫 번째 질문에만 답하고 끝낸다."],a:0,why:"질문이 두 개면 본문도 두 개입니다. 각 문단이 질문 하나씩 맡아야 읽는 사람이 '두 질문에 다 답했구나'를 바로 확인할 수 있어요. 하나를 빼먹으면 TR에서 크게 깎입니다.",pat:"이중질문형 = 질문 1 → 본문 1, 질문 2 → 본문 2"},
{id:"b47",link:"장단점형",q:"질문: 'Many students choose to study abroad. Discuss the advantages and disadvantages of studying abroad.' — 서론의 로드맵 문장으로 가장 완전한 것은?",opts:["This essay will discuss the main advantages and disadvantages of studying abroad.","I completely agree that studying abroad is the best way to learn a language.","Studying abroad is a common topic in many countries today."],a:0,why:"장단점형 서론은 내 의견부터 못 박는 자리가 아니에요. 장점과 단점, 두 방향을 다룰 것이라고 예고하는 문장이 로드맵의 역할을 합니다. 2번은 의견형의 입장문이라 유형이 다릅니다.",pat:"장단점형 로드맵 = This essay will discuss the advantages and disadvantages of ~"},
{id:"b48",link:"결론",q:"질문: 'Some people believe that university education should be free for all students. To what extent do you agree or disagree?' — 서론에서 '완전히 동의한다'고 밝혔다면, 결론으로 가장 완전한 것은?",opts:["In conclusion, I firmly believe that university education should be free for all students, as it creates fairer opportunities for individuals and benefits society as a whole.","In conclusion, university education has both advantages and disadvantages, and people have different opinions about it.","In conclusion, the government should also spend more money on primary schools and hospitals."],a:0,why:"결론은 서론의 입장을 같은 방향으로 압축해 다시 말하는 자리예요. 2번처럼 양쪽의 균형만 말하면 의견형의 입장이 흐려지고, 3번처럼 본문에 없던 새 주제(초등학교·병원 예산)를 꺼내면 새 정보를 넣는 오류가 됩니다.",pat:"의견형 결론 = In conclusion, + 서론 입장 반복 + 핵심 이유 요약"},
{id:"b49",link:"결론",q:"문제·해결형 에세이(주제: 교통 혼잡)의 결론으로 가장 완전한 것은?",opts:["In conclusion, traffic congestion is mainly caused by private car use and weak public transport, and it can be reduced by improving public transport and charging drivers in busy areas.","In conclusion, I completely agree that cars should be banned in all cities.","In conclusion, there are many other problems in cities, such as noise and housing shortages."],a:0,why:"문제·해결형 결론은 본문에서 다룬 원인 요약과 해결 요약이 한 쌍으로 들어가야 해요. 2번은 본문에 없던 전면 금지라는 새 입장이고, 3번은 본문에 없던 새 문제들로 빠져나갑니다.",pat:"문제·해결형 결론 = 원인 요약 + 해결 요약"},
{id:"b50",link:"최종 점검",q:"에세이를 마친 뒤, 제출 전 점검으로 가장 올바른 것은?",opts:["입장이 서론과 결론에서 같은지 확인하고, 각 본문이 주제문으로 시작하는지, 그리고 문장마다 주어와 동사가 있는지 차례로 확인한다.","어려운 단어를 더 많이 넣기 위해 모든 문장에 긴 단어를 하나씩 추가한다.","결론에 본문에서 말하지 않은 새로운 이유를 하나 더 추가해 글을 풍성하게 만든다."],a:0,why:"6.0의 마지막 점검은 새 내용을 더하는 일이 아니라 일치와 완성도를 확인하는 일이에요. 입장을 양쪽 끝에서 맞추고, 문단 뼈대와 문장의 완성(주어+동사)을 훑으면 감점 요인의 대부분을 잡을 수 있습니다.",pat:"최종 점검 = 입장 일치 → 문단 뼈대 → 문장 완성(주어+동사)"}
];
const BUILDER_ORDER=[
{id:"b10",tokens:["Although","university education","is expensive,","it","gives","students","better job opportunities."],why:"Although 절이 먼저, 콤마 뒤에 주절이 이어지는 순서예요.",pat:"Although + 절, + 주절"},
{id:"b11",tokens:["If","people","use public transport more,","traffic","will","decrease."],why:"조건(if 절, 현재형) → 결과(will) 순서입니다.",pat:"If + 현재형, + will + 결과"},
{id:"b12",tokens:["Technology","has made","communication","faster,","which","helps","businesses","grow."],why:"앞 문장 전체를 which로 받아서 결과를 붙였어요.",pat:"문장, which + 결과"},
{id:"b13",tokens:["Many students","study abroad","because","they","want","an international experience."],why:"주장 뒤에 because로 이유를 붙이는 가장 기본적인 확장입니다.",pat:"주장 + because + 이유"},
{id:"b14",tokens:["When","children","play outside,","they","develop","social skills."],why:"When 절(조건 상황) 뒤에 결과가 옵니다.",pat:"When + 상황, + 결과"},
{id:"b15",tokens:["The government","should invest","in renewable energy","to reduce","pollution."],why:"to + 동사원형으로 '목적'을 붙였어요. 짧지만 점수가 오르는 확장입니다.",pat:"행동 + to + 목적"},
{id:"b16",tokens:["Online courses","are popular","because","they","are","flexible and affordable."],why:"이유 절 안에도 주어+동사가 완전히 들어가야 해요.",pat:"주장 + because + 주어 + 동사 + 이유 내용"},
{id:"b17",tokens:["Regular exercise","improves","health,","so","many people","join gyms."],why:"콤마 + so로 결과를 잇는 순서예요.",pat:"원인, so + 결과"},
{id:"b18",tokens:["Cities","that","grow too quickly","often face","housing problems."],why:"that 절이 Cities를 뒤에서 설명해요. 주어와 동사(often face) 사이에 설명이 끼어드는 구조입니다.",pat:"명사 + that + 설명 + 동사"},
{id:"b23",tokens:["If","students","read regularly,","they","will","write better essays."],why:"조건(If 절, 현재형)이 먼저, 결과(will)가 뒤에 오는 순서예요.",pat:"If + 현재형, + will + 결과"},
{id:"b24",tokens:["When","people","exercise regularly,","they","sleep","better at night."],why:"When 절(상황) 뒤에 콤마, 그 뒤에 결과가 이어지는 순서예요.",pat:"When + 상황, + 결과"},
{id:"b25",tokens:["Students","who","read widely","usually","write","better essays."],why:"who 덩어리(read widely)가 Students를 설명하고, 그 뒤에 본동사 write가 와요. 설명이 주어와 동사 사이에 끼어드는 구조입니다.",pat:"명사 + who + 설명 + 동사"},
{id:"b26",tokens:["Online courses","offer recorded lectures,","which","allow","students","to review difficult topics."],why:"which가 앞의 recorded lectures를 받아서 그 효과를 이어줘요. 콤마 + which 순서입니다.",pat:"명사, which + 효과"},
{id:"b27",tokens:["Although","online learning","is convenient,","some students","prefer","face-to-face classes."],why:"Although 절(인정하는 단점)이 먼저, 콤마 뒤에 주절(그래도 성립하는 사실)이 오는 순서예요.",pat:"Although + 단점, + 그럼에도 주절"},
{id:"b28",tokens:["I","completely agree","that university education","should be free","for all students."],why:"입장(I completely agree)이 먼저, that 뒤에 동의하는 내용이 이어지는 순서예요.",pat:"I completely agree that + 주장"},
{id:"b29",tokens:["While","both skills are important,","I believe","cooperation","deserves greater emphasis","in schools."],why:"While 덩어리로 양쪽을 인정한 뒤, I believe로 내 의견을 못 박는 순서예요.",pat:"While 양쪽 인정, + I believe + 내 의견"},
{id:"b30",tokens:["This essay","will examine","the main causes","of this problem","and suggest","several possible solutions."],why:"질문 1(원인)을 예고하고, and suggest로 질문 2(해결책)를 예고하는 순서예요.",pat:"This essay will examine + 질문1, and suggest + 질문2"},
{id:"b31",tokens:["It is","often argued","that university education","should be provided","free of charge","for all students."],why:"서론 첫 문장의 조립이에요. It is often argued that으로 주체를 흐리고, free는 free of charge로 바꿨습니다.",pat:"It is often argued that + 패러프레이즈"},
{id:"b32",tokens:["I firmly believe","that public transport","should receive","more government funding","because it protects","the environment."],why:"입장(I firmly believe)이 먼저, because 뒤에 이유가 따라붙는 순서예요.",pat:"I firmly believe that + 주장 + because + 이유"},
{id:"b42",tokens:["This essay","will discuss","the main advantages","and disadvantages","of studying abroad."],why:"장단점형 서론의 로드맵 문장이에요. 두 방향(advantages / disadvantages)을 모두 예고하는 순서입니다.",pat:"This essay will discuss the advantages and disadvantages of + 주제"},
{id:"b43",tokens:["The main cause","of congestion","is that","too many people","rely on","private cars","for their daily travel."],why:"문제·해결형 본문 1의 첫 문장이에요. 문제(congestion)를 받은 뒤 is that 뒤에 원인을 붙이는 순서입니다.",pat:"The main cause of + 문제 + is that + 원인"},
{id:"b44",tokens:["This essay","will explain","why this trend","is happening","and discuss","whether it is","a positive development."],why:"이중질문형의 로드맵 문장이에요. 질문 1(why)을 explain으로, 질문 2(positive?)를 discuss whether로 예고하는 순서입니다.",pat:"This essay will explain why ~, and discuss whether ~"},
{id:"b45",tokens:["In conclusion,","I firmly believe","that university education","should be free","for all students."],why:"의견형 결론의 첫 문장이에요. 서론에서 밝힌 입장을 같은 단어로 다시 말하는 순서입니다 — 새 의견을 꺼내는 자리가 아니에요.",pat:"결론 = In conclusion, + 서론의 입장 반복"},
{id:"b46",tokens:["In conclusion,","although competition","has some value","in education,","cooperation is","more important","for children's","long-term development."],why:"논의형 결론의 모양이에요. although로 상대쪽 가치를 마지막으로 한 번 인정한 뒤, 내 의견으로 문장을 닫는 순서입니다.",pat:"논의형 결론 = although 양쪽 인정, + 내 의견으로 마무리"},
{id:"b51",tokens:["In conclusion,","traffic congestion","is mainly caused by","the growth of private car use","and weak public transport."],why:"문제·해결형 결론의 첫 문장이에요. 결론 신호(In conclusion) 뒤에 본문 1에서 다룬 원인 두 가지를 압축하는 순서입니다.",pat:"문제·해결형 결론 첫 문장 = In conclusion, + 원인 요약"},
{id:"b52",tokens:["In conclusion,","more people live alone","mainly because","they have greater freedom","and more opportunities in cities."],why:"이중질문형 결론의 첫 문장이에요. 첫 번째 질문(왜 혼자 사는가)에 대한 답을 because로 압축하는 순서입니다.",pat:"이중질문형 결론 = 질문 1 답 요약으로 시작"},
{id:"b53",tokens:["In conclusion,","studying abroad","offers valuable experience","and better","career opportunities."],why:"장단점형 결론의 첫 문장이에요. 장점 쪽 핵심(귀중한 경험·취업 기회)을 먼저 압축하는 순서이고, 다음 문장에서 단점과 균형을 이어갑니다.",pat:"장단점형 결론 = 장점 요약 → 단점·균형"}
];
const PARA=[
{id:"p1",topic:"교육 · 온라인 학습",note:"주제문 → First → 예시 → In addition → As a result. 본문 문단의 표준 뼈대예요.",s:["Online learning offers several benefits for students.","First, it allows them to study at their own pace.","For example, a student with a part-time job can watch lectures at night.","In addition, online courses are usually cheaper than traditional classes.","As a result, more people can access education."]},
{id:"p2",topic:"기술 · 스마트폰",note:"주제문 → 과거 대조 → 현재 → However(단점) → Overall(정리). 대조 구조가 보이죠.",s:["Smartphones have changed the way people communicate.","In the past, people waited days for letters to arrive.","Now, messages are sent and received in seconds.","However, this constant connection can also cause stress.","Overall, smartphones bring both convenience and new problems."]},
{id:"p3",topic:"건강 · 운동",note:"주제문 → Firstly → 구체 설명 → Moreover → For these reasons(결론).",s:["Regular exercise is essential for a healthy life.","Firstly, it strengthens the body and reduces the risk of disease.","People who exercise daily are less likely to suffer from obesity.","Moreover, physical activity improves mental health.","For these reasons, everyone should make time for exercise."]},
{id:"p4",topic:"환경 · 대중교통",note:"주제문 → 설명 → This means(결과) → For instance(예시) → Therefore(주장).",s:["Public transport plays a key role in protecting the environment.","Buses and trains carry many passengers at once.","This means fewer cars on the road and less air pollution.","For instance, one full bus can replace dozens of private cars.","Therefore, governments should invest more in public transport."]},
{id:"p5",topic:"일 · 재택근무",note:"주제문 → 장점 2개 → On the other hand(반대) → Despite(양보로 마무리).",s:["Working from home has become increasingly popular.","Employees save time because they do not need to commute.","They can also spend more time with their families.","On the other hand, some workers feel isolated at home.","Despite this drawback, remote work is likely to remain common."]},
{id:"p6",topic:"범죄 · 처벌",note:"주제문 → 근거 → 예시 → However(한계) → 대안 제시. 논의형 본문의 전형입니다.",s:["Many people believe that stricter punishments reduce crime.","When penalties are severe, criminals think twice before breaking the law.","For example, countries with strict drug laws often report lower drug offences.","However, punishment alone cannot solve the root causes of crime.","Education and jobs must also be provided to prevent crime."]}
];
const PARAPHRASE=[
{id:"pp1",q:"Some people think that university education should be free for all students.",opts:["It is believed that everyone should be able to attend university without paying fees.","Some people think university education is free for all students now.","Free university is a thing some people think students should think about."],a:0,why:"핵심은 두 가지예요: 주체를 흐리기(It is believed that), 핵심어를 바꾸기(free → without paying fees). 질문 문장을 그대로 베끼면 TR에서 감점됩니다.",pat:"Some people think → It is believed/argued that"},
{id:"pp2",q:"Many people believe that social networking sites have had a negative effect on individuals and society.",opts:["Social media platforms are thought to have harmed both people and communities.","Many people believe social networking sites are used negatively by individuals.","Social networking has had people and society, according to many beliefs."],a:0,why:"social networking sites → social media platforms, negative effect → harmed, individuals and society → people and communities. 단어 3개를 바꾸면 패러프레이즈 완성입니다.",pat:"핵심 명사·동사·형용사를 각각 동의어로 교체"},
{id:"pp3",q:"Some people say that the best way to reduce crime is to give longer prison sentences.",opts:["It is argued that increasing the length of prison terms is the most effective way to lower crime rates.","Some people say prisons should be longer for crime people.","The best way is longer prison sentences, some people say about crime."],a:0,why:"give longer prison sentences → increasing the length of prison terms처럼 동사를 명사구로 바꾸면 수준이 올라가 보여요.",pat:"동사구 → 명사구로 바꾸기 (give longer → increasing the length of)"},
{id:"pp4",q:"In many countries, plastic containers have become more common than ever.",opts:["Plastic packaging is now used more widely than in the past in numerous nations.","In many countries, plastic containers are common than ever now.","Plastic containers have become countries in many common ways."],a:0,why:"containers → packaging, more common → used more widely, many countries → numerous nations. 뜻은 같고 옷만 갈아입혔어요.",pat:"같은 뜻, 다른 단어 3개"},
{id:"pp5",q:"Some people think that it is better to live in a small town than in a big city.",opts:["Living in a small town is considered preferable to living in a large city.","It is better to live in a small town than a big city, some people think.","Some people think small towns are better cities than big ones."],a:0,why:"better → preferable, big → large. 비교 구조는 유지하되 단어만 교체했어요.",pat:"better → preferable / big → large 같은 안전 교체"},
{id:"pp6",q:"Governments should spend more money on public services rather than the arts.",opts:["It is argued that governments ought to fund public services instead of spending on the arts.","Governments should spend more money on public services, not the arts.","The arts should rather get money from governments than public services."],a:0,why:"세 번째 선택지는 뜻이 뒤집혔어요. 패러프레이즈에서 가장 위험한 건 뜻이 바뀌는 것 — 단어 교체보다 뜻 보존이 먼저입니다.",pat:"뜻 보존 > 단어 교체 (뜻이 바뀌면 오답)"},
{id:"pp7",q:"Many children nowadays spend too much time playing video games.",opts:["These days, a large number of children spend excessive amounts of time on video games.","Nowadays many children play too much time with video games.","Children spend too much time nowadays, many of them, on games video."],a:0,why:"nowadays → these days, many → a large number of, too much → excessive amounts of. 세트처럼 통째로 익혀두세요.",pat:"nowadays → these days / many → a large number of"},
{id:"pp8",q:"Some people believe that working from home is better than working in an office.",opts:["Remote work is thought to be more beneficial than office-based work.","Working from home is better than office, believed by some people.","Some people believe home work beats office work better."],a:0,why:"working from home → remote work처럼 개념을 한 단어로 압축하면 밴드가 올라가 보여요.",pat:"길게 풀린 표현 → 압축된 개념어 (remote work)"},
{id:"pp9",q:"The most important aim of science should be to improve people's lives.",opts:["The primary goal of science ought to be enhancing human life.","Science should aim most importantly to improve people lives.","The most important aim is science improving lives of people."],a:0,why:"most important aim → primary goal, improve → enhancing. should → ought to도 안전한 교체입니다.",pat:"aim → goal / improve → enhance / should → ought to"},
{id:"pp10",q:"In some countries, many people choose to live alone today.",opts:["Nowadays, living alone is increasingly common in some nations.","Today many people in some countries choose alone living.","People choose today to live in some countries alone."],a:0,why:"'choose to live alone' → 'living alone is common'처럼 행위 → 현상으로 바꾸는 것도 좋은 패러프레이즈예요.",pat:"행위 표현 → 현상 표현으로 전환"},
{id:"pp11",q:"Some people think that a high salary is the most important factor when choosing a job.",opts:["For some, pay is regarded as the key consideration in selecting a career.","A high salary is the most important factor for some people think.","Salary high is important factor most when job choosing."],a:0,why:"a high salary → pay, most important factor → key consideration, choosing a job → selecting a career. 전부 세트 교체입니다.",pat:"factor → consideration / choose → select"},
{id:"pp12",q:"Many people say that international tourism creates tension rather than understanding between cultures.",opts:["It is often claimed that global tourism leads to conflict instead of cultural understanding.","International tourism creates tension, many people say, rather than understanding.","Tourism between cultures creates understanding rather than tension, people say."],a:0,why:"세 번째는 rather than의 앞뒤가 뒤집혀 뜻이 반대가 됐어요. 비교·대조 구조는 특히 주의하세요.",pat:"creates → leads to / tension → conflict"},
{id:"pp13",q:"Some people believe that school children should not be given homework.",opts:["It is believed that homework should not be assigned to school pupils.","School children should not be given homework, believe some people.","Homework should not be believed for school children to give."],a:0,why:"be given → be assigned, children → pupils. 수동태를 수동태로 유지한 것도 포인트예요.",pat:"give → assign / children → pupils"},
{id:"pp14",q:"As technology develops, traditional skills such as making food by hand are disappearing.",opts:["Traditional abilities like cooking by hand are being lost as technology advances.","Technology develops and traditional skills disappear such as hand food.","Making food by hand is a traditional skill technology disappears."],a:0,why:"문장 순서까지 바꿨어요(원인↔결과 교체). 단어 교체 다음 단계가 구조 교체입니다.",pat:"문장 순서 교체 + 단어 교체 = 고급 패러프레이즈"},
{id:"pp15",q:"Some people think that the government should pay for health care for all citizens.",opts:["It is argued that free health care for everyone should be funded by the state.","The government should pay health care for all citizens, thinks some people.","Health care should be paid by citizens for all government."],a:0,why:"pay for → fund, the government → the state. 국가·정부 단어 교체는 단골입니다.",pat:"government → the state / pay for → fund"}
];

const ASSEMBLY=[
{id:"a1",type:"의견형 (Opinion)",q:"Some people believe that university education should be free for all students. To what extent do you agree or disagree?",band:"이 에세이의 수준: Band 6.5 — 화려하지 않지만 오류가 거의 없고 구조가 완전합니다. 6.0의 목표는 바로 이 모습이에요.",breaks:[2,8,14],parts:["서론","본문 1 — 개인에게 공평한 기회","본문 2 — 사회 전체의 이익","결론"],s:[
"It is often argued that university education should be provided free of charge for all students.",
"I completely agree with this view because equal access to education benefits both individuals and society as a whole.",
"The main reason for my view is that free university education gives everyone a fair chance to succeed.",
"If students from poor families do not have to pay tuition fees, they can focus fully on their studies.",
"For example, in some European countries, talented students from low-income backgrounds can attend university and later find well-paid jobs.",
"These students can graduate without debt, so they are free to choose jobs that they find meaningful.",
"Free education also helps talented students from rural areas, who often have fewer opportunities than students in large cities.",
"As a result, free education can reduce the gap between the rich and the poor.",
"Another reason is that society as a whole gains from having more educated citizens.",
"Graduates tend to earn higher salaries, so they pay more tax to the government.",
"In addition, educated people are more likely to contribute to innovation and economic growth.",
"Educated citizens also tend to make healthier choices, which reduces pressure on public hospitals.",
"Finally, educated citizens are more likely to take part in community life and to vote in elections.",
"This means that the money spent on free education can be recovered in the long term.",
"In conclusion, I firmly believe that university education should be free for all students.",
"It creates fairer opportunities for individuals and brings lasting benefits to society."]},
{id:"a2",type:"논의형 (Discussion)",q:"Some people think that children should learn to compete, while others believe that cooperation is more valuable. Discuss both views and give your own opinion.",band:"이 에세이의 수준: Band 6.5 — 양쪽 관점을 공정하게 다루고 마지막에 자기 의견을 분명히 밝히는 논의형의 표준 구조예요.",breaks:[2,8,14],parts:["서론","본문 1 — 경쟁을 지지하는 관점","본문 2 — 협력을 지지하는 관점 + 내 의견","결론"],s:[
"It is often debated whether children should be taught to compete or to cooperate with each other.",
"While both skills are important, I believe that cooperation deserves greater emphasis in schools.",
"On the one hand, competition can motivate children to work hard and achieve their best.",
"In competitive activities such as sports and exams, children learn to set goals and deal with failure.",
"This can prepare them for adult life, where they often have to compete for jobs.",
"It also shows children that rewards usually depend on effort, so they learn to take responsibility for their results.",
"For example, young athletes train for months before a single competition, and this experience builds patience and discipline.",
"Moreover, a competitive environment can reveal talented children who might otherwise be overlooked.",
"On the other hand, cooperation teaches children to communicate and solve problems as a team.",
"In most real jobs, success depends on working effectively with colleagues rather than outperforming them.",
"Group projects also allow children to share ideas and to learn from classmates who see problems in different ways.",
"Such skills are difficult to develop through textbooks alone and need regular practice in the classroom.",
"Children who only learn to compete may become selfish and find it difficult to build relationships.",
"For this reason, I believe schools should create more opportunities for group work and team projects.",
"In conclusion, although competition has some value in education, cooperation is more important for children's long-term development.",
"Schools should therefore focus mainly on teaching children how to work well with others."]},
{id:"a3",type:"문제·해결형 (Problem & Solution)",q:"In many cities, traffic congestion is becoming a serious problem. What are the causes of this problem, and what measures can be taken to solve it?",band:"이 에세이의 수준: Band 6.5 — 질문이 두 개(원인/해결)라 본문도 두 개로 정확히 나눴습니다. 질문 구조 = 에세이 구조예요.",breaks:[2,9,15],parts:["서론","본문 1 — 원인","본문 2 — 해결책","결론"],s:[
"Traffic congestion has become a major problem in many large cities around the world.",
"This essay will examine the main causes of this problem and suggest several possible solutions.",
"The main cause of congestion is that too many people rely on private cars for their daily travel.",
"As incomes rise, more families can afford cars, so the number of vehicles on the road keeps increasing.",
"Many workers also live far from their offices, so driving is often the only practical option for them.",
"In addition, many cities have poor public transport systems, which gives people few real alternatives.",
"When buses are slow and crowded, most people naturally choose to drive instead.",
"Roads in many city centres were designed long ago for far fewer vehicles.",
"This creates a cycle in which roads become more congested every year.",
"Several measures can be taken to deal with this problem.",
"Firstly, governments should invest in faster and more reliable public transport, such as subway systems.",
"If public transport becomes convenient, many drivers will leave their cars at home.",
"Governments should also make buses cheaper, so that public transport is attractive to low-income workers as well.",
"Another solution is to introduce a congestion charge for driving in city centres, as has been done in London.",
"Together, these measures can change travel habits without banning cars completely.",
"In conclusion, traffic congestion is mainly caused by the growth of private car use and weak public transport.",
"By improving public transport and charging drivers in busy areas, cities can significantly reduce this problem."]},
{id:"a4",type:"장단점형 (Advantages & Disadvantages)",q:"Many students choose to study abroad. Discuss the advantages and disadvantages of studying abroad.",band:"이 에세이의 수준: Band 6.5 — 장점 문단과 단점 문단의 무게가 비슷하고, 결론에서 어느 한쪽으로 단정하지 않고 균형을 정리한 장단점형의 표준 구조예요.",breaks:[2,8,14],parts:["서론","본문 1 — 장점","본문 2 — 단점","결론"],s:[
"Studying abroad has become an increasingly popular choice among young people in many countries.",
"This essay will discuss the main advantages and disadvantages of this trend.",
"The main advantage of studying abroad is that students can experience a different culture while they learn.",
"Living in a foreign country helps them become more independent, because they have to manage daily life without their family.",
"They also have daily opportunities to practise a foreign language with local people, which is difficult to achieve at home.",
"For example, students who study overseas often learn to cook, manage money, and solve problems on their own.",
"In addition, graduates with international experience may find it easier to get a job in global companies.",
"Employers often value this international experience because it shows that a graduate can adapt quickly to new environments and different working cultures.",
"However, studying abroad also has clear disadvantages.",
"The most serious problem is the high cost, which includes tuition fees, housing, and flights.",
"Many students have to borrow large amounts of money or work long hours in part-time jobs while they study.",
"As a result, studying abroad may only be possible for students from wealthy families.",
"Another drawback is that some students feel lonely and find it difficult to adapt to a new culture.",
"Because of these pressures, some students return home earlier than planned, without finishing their course.",
"In conclusion, studying abroad offers valuable experience and better career opportunities.",
"However, its high cost and emotional difficulties mean that it is not the best choice for everyone."]},
{id:"a5",type:"이중질문형 (Two-part Question)",q:"In many countries, more people are choosing to live alone. Why is this happening? Is this a positive or negative development?",band:"이 에세이의 수준: Band 6.5 — 질문이 두 개라 본문도 두 개입니다. 본문 1은 원인만, 본문 2는 긍정·부정 평가만 다뤄서 두 질문에 빠짐없이 답했어요.",breaks:[2,8,14],parts:["서론","본문 1 — 원인 (질문 1)","본문 2 — 긍정적인가 (질문 2)","결론"],s:[
"In many countries, living alone is becoming increasingly common, especially among young adults and the elderly.",
"This essay will explain the main reasons for this trend and discuss whether it is a positive or negative development.",
"One main reason is that people now have more freedom to choose how they live.",
"As education and incomes have improved, more people can afford to rent or buy a home on their own.",
"Changes in social attitudes also mean that living alone no longer carries the negative image it once had.",
"In addition, many young people move to large cities for work or study, far from their families.",
"Living with strangers in shared housing can be uncomfortable, so many prefer a small home of their own.",
"Smaller households have therefore become a normal part of modern city life.",
"In my view, this trend is largely positive, although it has some drawbacks.",
"Living alone allows people to enjoy privacy and make decisions without considering others.",
"They can build daily routines that suit their own work and study schedules.",
"It can also help young adults become independent and responsible for their own lives.",
"For older people, staying in their own home can also help them keep a sense of control over their lives.",
"However, some people who live alone may feel lonely, and housing costs can be a heavy burden for one person.",
"In conclusion, more people live alone mainly because they have greater freedom and more opportunities in cities.",
"Overall, I believe this is a positive development, as long as people maintain close relationships with family and friends."]},
{id:"a6",type:"긍정·부정형 (Positive or Negative Development)",q:"In recent years, online shopping has become increasingly popular around the world. Is this a positive or negative development?",band:"이 에세이의 수준: Band 6.5 — 질문이 '긍정인가 부정인가' 하나라 서론에서 입장을 먼저 밝히고, 본문 1은 긍정적인 면, 본문 2는 부정적인 면을 다룬 뒤 결론에서 입장을 다시 확인하는 표준 구조예요.",breaks:[2,8,14],parts:["서론","본문 1 — 긍정적인 면","본문 2 — 부정적인 면","결론"],s:[
"In recent years, online shopping has become increasingly popular in many countries around the world.",
"In my view, this is a largely positive development because it makes shopping more convenient for consumers, although it also creates some problems for local businesses.",
"The main benefit of online shopping is that people can buy almost anything without leaving their homes.",
"This is particularly helpful for people who live in rural areas or who are too busy to visit physical stores.",
"For example, a parent with young children can order food and household goods in a few minutes late at night.",
"Online stores also offer a much wider choice of products than most local shops can provide.",
"In addition, customers can compare prices easily and read reviews from other buyers before they make a decision.",
"As a result, they are more likely to buy suitable products at reasonable prices.",
"However, the growth of online shopping also has some clear disadvantages.",
"As more people shop online, many small local shops lose customers and are forced to close.",
"This can damage local economies and lead to job losses in town centres.",
"Another problem is that frequent deliveries increase traffic and packaging waste in cities.",
"Online shopping can also encourage people to buy things they do not really need.",
"Because returning products is sometimes difficult, some of these unnecessary purchases are simply thrown away.",
"In conclusion, online shopping is a positive development overall because its convenience and wider choice benefit most consumers.",
"However, governments should support small local businesses and reduce delivery waste, so that this growth does not harm local communities."]}
];

{id:"w2d1",title:"이유 붙이기 — because",pat:"주장 + because + 이유 (완전한 문장)",models:[["Many students study abroad because they want an international experience.","많은 학생이 국제 경험을 원해서 유학을 갑니다."],["Online courses are popular because they are flexible and affordable.","온라인 강의는 유연하고 저렴해서 인기가 많습니다."],["People exercise regularly because they want to stay healthy.","사람들은 건강을 유지하고 싶어서 규칙적으로 운동합니다."]],note:"because 뒤에는 '주어+동사'가 있는 완전한 이유가 와야 해요. 에세이 본문의 모든 근거는 사실상 because 문장의 변형입니다.",ex:[["mcq","builder","b1"],["order","builder","b13"],["order","builder","b16"],["mcq","clinic","c22"]]},
